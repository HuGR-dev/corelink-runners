name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    # Secretless, isolated correctness gate on a standard GitHub-hosted Linux VM.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3 (Node 24; v4 is Node 20, forced off runners 2026-06-16)
        with:
          fetch-depth: 0

      # G0 · container entrypoint signal discipline — pinned after the 2026-08-23
      # leaked-box incident (3 boxes alive 10.5 h against a 15-minute idle window,
      # ~126 vCPU-h). The platform's only soft stop is SIGTERM and an untrapped
      # PID 1 discards it, so a regression here is invisible until the bill arrives.
      # Pure bash, no toolchain, ~6 s — placed first so it fails before anything heavy.
      - name: entrypoint signal discipline (G0)
        run: bash deploy/runner/test/entrypoint-signal.test.sh

      - name: entrypoint /dev/shm provisioning
        run: bash deploy/runner/test/entrypoint-devshm.test.sh

      # G1 · e2e completeness-critic — proves EVERY product atom (55 features + 155
      # scenarios, parsed live from the ledger) is bound to a validation cell. Zero-dep
      # `node --test`; placed first so a coverage regression fails in seconds, before the
      # heavy Rust build. Adding an F-id/S-id to the ledger without a cell turns this red.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4; node for the critic (matches build-cf-container-images.yml)
        with:
          node-version: '22'

      - name: e2e completeness-critic (G1)
        run: node --test scripts/e2e/completeness.test.mjs

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          # Pinned tool versions (proven on the corelink-builder box). The
          # @latest default broke on a checksum mismatch between the action's
          # vendored manifest and a re-published cargo-deny release asset.
          tool: cargo-audit@0.22.2,cargo-deny@0.19.8

      # Ensure ~/.cargo/bin is on PATH for every gate step below: rust-toolchain
      # and install-action both install into CARGO_HOME/bin, and prepending it
      # once here guarantees cargo / cargo-deny / cargo-audit resolve (guards the
      # exit-127 "binary present but not on PATH" class in one place).
      - name: ensure cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: deny
        run: cargo deny check

      - name: audit
        run: cargo audit --deny warnings
