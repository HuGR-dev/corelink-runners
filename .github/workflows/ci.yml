name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    # CI runs on the CoreLink ephemeral runner fleet (ADR-0007 Stage B): the
    # `workflow_job` autoscaler provisions a cache-warm microVM per queued job
    # via `POST /webhooks/github`, the job runs, the box self-deregisters.
    # `corelink-dogfood` is the JIT label the autoscaler serves (NEVER the
    # persistent `corelink-builder` Mac — that is being retired from CI). The
    # runner image bakes the full gate toolchain (rust 1.96.0 + rustfmt/clippy +
    # cargo-deny/cargo-audit), so the gate runs warm. See deploy/autoscaler-stage-b.md.
    runs-on: corelink-dogfood
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3 (Node 24; v4 is Node 20, forced off runners 2026-06-16)
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          # Pinned tool versions (proven on the corelink-builder box). The
          # @latest default broke on a checksum mismatch between the action's
          # vendored manifest and a re-published cargo-deny release asset.
          tool: cargo-audit@0.22.2,cargo-deny@0.19.8

      # Self-hosted builder hardening: a concurrent rustup churn + disk pressure
      # has intermittently dropped CARGO_HOME/bin (the rustup proxy AND the
      # pinned cargo-deny/cargo-audit) from the run-step PATH — surfacing as
      # exit 127 on cargo/cargo-deny/cargo-audit even though the binaries are
      # present in ~/.cargo/bin. Prepending it to GITHUB_PATH here makes every
      # gate step below resilient to that flake in one place.
      - name: ensure cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: deny
        run: cargo deny check

      - name: audit
        run: cargo audit --deny warnings
