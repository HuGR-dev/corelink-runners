# Build + push the CoreLink CF Container images to the Cloudflare MANAGED registry
# (ADR-0008). This is what takes local Docker OUT of the deploy loop: once these
# images live in `registry.cloudflare.com/<ACCOUNT_ID>/...`, `deploy/cloudflare/
# wrangler.jsonc` references them by tag/digest and a local `wrangler deploy` no
# longer needs a Docker daemon.
#
# Two images are built + pushed (both are Container-DO classes in wrangler.jsonc):
#   - RunnerContainer   (build context: deploy/runner)      -> corelink-spawn-worker-runnercontainer
#   - CheckHostContainer(build context: deploy/check-host)  -> corelink-spawn-worker-checkhostcontainer
#
# NOTE: the check-host image has NEVER been pushed to the CF registry. THIS
# workflow creates it on its first run; only after that first push can
# wrangler.jsonc's CheckHostContainer be flipped off its Dockerfile (see the
# comment there).
#
# ── OWNER DEPENDENCIES (must be satisfied before this workflow can succeed) ────
#   1. GH SECRET `CLOUDFLARE_API_TOKEN` — a Cloudflare API token with
#      Containers/Workers push scope for account 6a1fc1c626fc2628823e60b9db01f5cd.
#      Wrangler reads it from the env; the job is GUARDED on it (fails fast, with
#      a clear message, if the secret is absent).
#   2. A self-hosted LINUX x64 runner labelled `corelink-builder` WITH DOCKER.
#      We deliberately do NOT use GitHub-hosted `ubuntu-latest`: the org is on the
#      free plan and GH-hosted minutes hit a billing wall. CONFIRM that builder
#      still exists / is online before the first dispatch — if it was retired,
#      re-provision a Docker-capable Linux x64 self-hosted runner with this label.
#      (Wrangler needs a working Docker CLI + daemon to BUILD the images.)
name: build-cf-container-images

on:
  # MANUAL-ONLY (2026-07-06): the push-on-paths trigger fired a heavy Docker image
  # build on every wrangler.jsonc/Dockerfile merge, hammering the self-hosted
  # builder. The image changes rarely; dispatch it explicitly when the runner
  # Dockerfile actually changes (`gh workflow run build-cf-container-images.yml`).
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd

jobs:
  build-and-push:
    # Self-hosted Linux x64 builder (label `corelink-builder`). NOT GH-hosted
    # (free-plan billing wall). Needs Docker for wrangler to build.
    runs-on: [self-hosted, Linux, X64, corelink-builder]
    timeout-minutes: 120
    steps:
      - name: Guard — require the CLOUDFLARE_API_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GH secret CLOUDFLARE_API_TOKEN — a Cloudflare API" \
                 "token with Containers/Workers push scope for account" \
                 "${CLOUDFLARE_ACCOUNT_ID} is required. Set it in repo Settings →" \
                 "Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity — Docker is available (wrangler needs it to BUILD)
        run: docker version

      # The self-hosted Linux builder has Docker but NOT Node/npm on the runner
      # PATH (`npm: command not found`, 2026-07-05). setup-node provisions a
      # deterministic Node into the runner tool-cache so `npm ci` (wrangler) works
      # without a machine-level install.
      - name: Set up Node (wrangler needs npm; wrangler requires Node >= 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (wrangler)
        working-directory: deploy/cloudflare
        run: npm ci

      # `wrangler containers build --push` builds the image from the given
      # Dockerfile/context and pushes it to the Cloudflare managed registry,
      # returning the pushed reference. We name each image to match the
      # DO class it backs (the CF convention <worker>-<classlower>). The tag is
      # the commit SHA for traceability; wrangler also computes the digest.
      - name: Build + push RunnerContainer image
        id: runner
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="corelink-spawn-worker-runnercontainer"
          TAG="${GITHUB_SHA}"
          # <PATH> positional = build context (Dockerfile lives there);
          # --tag = <name>:<tag>; --push uploads to the CF managed registry.
          OUT="$(npx wrangler containers build ../runner \
            --tag "${IMAGE}:${TAG}" \
            --push 2>&1 | tee /dev/stderr)"
          # Extract the pushed registry ref (…@sha256:… if present, else the tag).
          REF="$(printf '%s\n' "${OUT}" | grep -oE 'registry\.cloudflare\.com/[^ ]+@sha256:[0-9a-f]{64}' | head -n1 || true)"
          if [ -z "${REF}" ]; then
            REF="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${IMAGE}:${TAG}"
          fi
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "Runner image pushed: ${REF}"

      # The check-host image COPYs a prebuilt exec-server binary from its build
      # context (deploy/check-host, since `wrangler containers build <dir>` uses
      # <dir> as BOTH the Dockerfile location and the context). Compile it for musl
      # (static → runs on debian:12-slim regardless of glibc version) and stage it
      # into the context before building the image.
      - name: Set up Rust (exec-server, musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build corelink-check-exec-server (musl) into the check-host context
        run: |
          set -euo pipefail
          # dtolnay puts rustup+cargo on PATH; also front the builder's own cargo
          # home so `rustup target add` lands on the toolchain `cargo` actually uses
          # (self-hosted builder had E0463 'can't find core' when they diverged).
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools || \
            echo "::warning::musl-tools install failed (may already be present); continuing"
          cargo build -p corelink-check-exec-server --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/corelink-check-exec-server \
             deploy/check-host/corelink-check-exec-server
          ls -la deploy/check-host/corelink-check-exec-server

      - name: Build + push CheckHostContainer image
        id: checkhost
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="corelink-spawn-worker-checkhostcontainer"
          TAG="${GITHUB_SHA}"
          OUT="$(npx wrangler containers build ../check-host \
            --tag "${IMAGE}:${TAG}" \
            --push 2>&1 | tee /dev/stderr)"
          REF="$(printf '%s\n' "${OUT}" | grep -oE 'registry\.cloudflare\.com/[^ ]+@sha256:[0-9a-f]{64}' | head -n1 || true)"
          if [ -z "${REF}" ]; then
            REF="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${IMAGE}:${TAG}"
          fi
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "Check-host image pushed: ${REF}"

      - name: Summary — pushed image refs to pin in wrangler.jsonc
        run: |
          {
            echo "### CoreLink CF Container images pushed"
            echo ""
            echo "Pin these in \`deploy/cloudflare/wrangler.jsonc\` (containers[].image):"
            echo ""
            echo "**RunnerContainer**"
            echo '```'
            echo "${{ steps.runner.outputs.ref }}"
            echo '```'
            echo ""
            echo "**CheckHostContainer** (first push — then flip wrangler.jsonc off the Dockerfile)"
            echo '```'
            echo "${{ steps.checkhost.outputs.ref }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
