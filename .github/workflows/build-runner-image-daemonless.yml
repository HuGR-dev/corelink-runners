# One-off: build the RunnerContainer image (deploy/runner, now baking BuildKit)
# DAEMONLESS on the corelink fleet, and push a CANDIDATE tag to the CF managed
# registry. Does NOT repin the fleet — this only proves the daemonless build path
# for the heavy runner image and produces a digest to validate + repin manually.
#
# Replaces the broken build-cf-container-images.yml (ubuntu-latest, hosted +
# startup_failures) and the local-docker `wrangler containers build` path: no
# docker, no hosted, dogfood of the very capability being baked.
#
# The current fleet image does NOT have BuildKit yet (that is what this builds),
# so BuildKit is FETCHED here at job time (pinned, matches the Dockerfile bake).
name: build-runner-image-daemonless

on:
  push:
    branches: [proof/runner-image-daemonless]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd

jobs:
  build:
    name: buildctl-build the runner image + push candidate tag
    runs-on: corelink
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Fetch BuildKit v0.32.2 (pinned) + runc
        run: |
          set -euo pipefail
          VER=v0.32.2
          SHA=2975d0f651ad96ba8b80b9992ae1f9a964f4408569af5b6dc36544165c3926af
          curl -fsSL -o bk.tgz "https://github.com/moby/buildkit/releases/download/${VER}/buildkit-${VER}.linux-amd64.tar.gz"
          echo "${SHA}  bk.tgz" | sha256sum -c -
          tar xzf bk.tgz
          sudo install -m0755 bin/buildkit-runc /usr/local/bin/runc
          sudo install -m0755 bin/buildkitd /usr/local/bin/buildkitd
          sudo install -m0755 bin/buildctl  /usr/local/bin/buildctl
          for p in bin/buildkit-cni-*; do sudo install -m0755 "$p" /usr/local/bin/; done

      - name: Start buildkitd
        run: |
          set -uo pipefail
          ADDR="unix://$RUNNER_TEMP/bk.sock"
          echo "BUILDKIT_ADDR=$ADDR" >> "$GITHUB_ENV"
          sudo sh -c "buildkitd --addr '$ADDR' --oci-worker-snapshotter=overlayfs --root '$RUNNER_TEMP/bkroot' >'$RUNNER_TEMP/bk.log' 2>&1 &"
          for i in $(seq 1 40); do sudo buildctl --addr "$ADDR" debug workers >/dev/null 2>&1 && { echo "up ${i}s"; break; }; sleep 1; done
          sudo buildctl --addr "$ADDR" debug workers >/dev/null 2>&1 || { echo "::error::buildkitd down"; sudo sed -n '1,60p' "$RUNNER_TEMP/bk.log"; exit 1; }

      - name: Build deploy/runner (BuildKit-baked image) + push candidate tag
        id: build
        run: |
          set -uo pipefail
          IMG="corelink-spawn-worker-runnercontainer"
          TAG="buildkit-candidate-$(git rev-parse --short HEAD)"
          REF="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${IMG}:${TAG}"

          CRED="$(npx -y wrangler@4.111.0 containers registries credentials registry.cloudflare.com --push --expiration-minutes 45 --json 2>/dev/null)"
          U=$(echo "$CRED" | jq -r '.username'); P=$(echo "$CRED" | jq -r '.password')
          [ -n "$U" ] && [ -n "$P" ] || { echo "::error::cred mint failed"; exit 1; }
          AUTH=$(printf '%s:%s' "$U" "$P" | base64 | tr -d '\n')
          CFG="$RUNNER_TEMP/dockercfg"; mkdir -p "$CFG"
          printf '{"auths":{"registry.cloudflare.com":{"auth":"%s"}}}' "$AUTH" > "$CFG/config.json"

          echo "Building $REF (context=deploy/runner) …"
          sudo DOCKER_CONFIG="$CFG" buildctl --addr "$BUILDKIT_ADDR" build \
            --frontend dockerfile.v0 \
            --local context=deploy/runner --local dockerfile=deploy/runner \
            --output type=image,name="$REF",push=true 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -60

          DIGEST=$(grep -oE 'exporting manifest sha256:[0-9a-f]{64}' "$RUNNER_TEMP/build.log" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1)
          echo "candidate_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "candidate_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "════ CANDIDATE ════"
          echo "  tag ref: $REF"
          echo "  digest:  ${DIGEST:-<none>}"

      - name: Verify BuildKit + runc are IN the built image (daemonless)
        run: |
          set -uo pipefail
          # Extract the image rootfs and assert the three binaries are present +
          # executable — proves the bake landed in the image we just pushed.
          B="$RUNNER_TEMP/verify"; mkdir -p "$B"
          sudo buildctl --addr "$BUILDKIT_ADDR" build \
            --frontend dockerfile.v0 --local context=deploy/runner --local dockerfile=deploy/runner \
            --output type=local,dest="$B/rootfs" >/dev/null 2>&1
          miss=0
          for bin in usr/local/bin/buildkitd usr/local/bin/buildctl usr/local/bin/runc; do
            if sudo test -x "$B/rootfs/$bin"; then echo "  ✓ $bin present"; else echo "::error::$bin MISSING from image"; miss=1; fi
          done
          [ "$miss" = "0" ] && echo "✓ image carries BuildKit+runc — candidate is valid for the fleet repin" || exit 1

      - name: Next
        run: |
          echo "CANDIDATE built+pushed DAEMONLESS. To roll the fleet:"
          echo "  1) repin wrangler.jsonc RunnerContainer image @${{ steps.build.outputs.candidate_digest }}"
          echo "  2) wrangler deploy the spawn-worker"
          echo "  3) prove a runs-on: corelink job uses the baked buildkit; rollback digest = f6d787b6…"
