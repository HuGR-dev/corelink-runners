# TEMPORARY PROBE — delete after use. Finds the `docker login registry.cloudflare.com`
# credential recipe so the image-build lane can push daemonlessly on runs-on:corelink
# (login only — NO build, NO push; the token is fed via --password-stdin and never echoed).
name: probe-cf-registry-login

on:
  workflow_dispatch: {}
  push:
    branches: [chore/probe-cf-registry-login]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd

jobs:
  probe:
    runs-on: corelink
    timeout-minutes: 10
    steps:
      - name: try docker login schemes against registry.cloudflare.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -u
          REG="registry.cloudflare.com"
          if [ -z "${CF_TOKEN:-}" ]; then echo "::error::no CLOUDFLARE_API_TOKEN"; exit 1; fi
          try() {
            user="$1"
            # login via the docker shim (-> nerdctl login); token on stdin, never printed
            if printf '%s' "$CF_TOKEN" | docker login "$REG" -u "$user" --password-stdin >/tmp/login.out 2>&1; then
              echo "SUCCESS  user='$user'"
              return 0
            else
              echo "fail     user='$user'  ($(tail -n1 /tmp/login.out 2>/dev/null | tr -d '\r'))"
              return 1
            fi
          }
          ok=""
          for u in "$CLOUDFLARE_ACCOUNT_ID" "v1" "token" "oauth2" "00000000-0000-0000-0000-000000000000" "_json_key" "api"; do
            if try "$u"; then ok="$u"; break; fi
          done
          echo "----"
          if [ -n "$ok" ]; then
            echo "WINNER: docker login $REG -u '$ok' --password-stdin  <<< \$CLOUDFLARE_API_TOKEN"
          else
            echo "NO SCHEME WORKED — CF managed registry likely needs a wrangler-minted short-lived cred, not the raw API token."
          fi
