# TEMPORARY PROBE — delete after use. Proves the daemonless build->push chain on a
# runs-on:corelink lease: plain `docker build` (via the shim -> nerdctl) + `wrangler
# containers push` (wrangler mints the CF registry cred + pushes via the docker binary).
# Uses a TINY image (~2 min) to de-risk before rewriting the real 13-min runner-image lane.
# Pushing a throwaway tag is SAFE — the fleet uses a PINNED digest, unaffected by new tags.
name: probe-cf-registry-login

on:
  workflow_dispatch: {}
  push:
    branches: [chore/probe-cf-registry-login]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd

jobs:
  probe:
    runs-on: corelink
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: tiny build context
        run: |
          mkdir -p /tmp/tiny
          printf 'FROM ubuntu:24.04\nRUN echo corelink-push-probe > /tmp/marker\n' > /tmp/tiny/Dockerfile
      - name: docker build (plain, via shim)
        run: |
          set -x
          docker build -t corelink-push-probe:test /tmp/tiny
      - name: wrangler deps
        working-directory: deploy/cloudflare
        run: npm ci
      - name: wrangler containers push (mints CF cred + pushes)
        working-directory: deploy/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          npx wrangler containers push corelink-push-probe:test 2>&1 | tee /tmp/push.out
          echo "---- exit ${PIPESTATUS[0]} ----"
