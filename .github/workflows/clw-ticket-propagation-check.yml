# Decoupled env-0 propagation check (clw coordinator tip, 2026-07-06): does the
# cred-ticket env trio reach the `clw run` child? Runs on ANY dogfood box (no env-0
# arm, no reliable env-0 spawn needed) — we set a FAKE ticket + an unreachable
# fabric endpoint inline and read which path clw takes:
#   • "redemption transport error … /v1/leases/L1/cas-cred" ⇒ BROKER path taken ⇒
#     propagation is FINE (#2 just rides #1, the spawn-reliability fix).
#   • "missing token" ⇒ the trio isn't reaching the clw child ⇒ a real propagation
#     gap to fix (independent of #1).
name: clw-ticket-propagation-check

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: corelink-dogfood
    steps:
      - name: clw version
        run: clw --version || true
      - name: clw run with a FAKE ticket (broker-path vs missing-token)
        run: |
          set +e
          echo "=== CLW_TOKEN unset; fake ticket + unreachable fabric endpoint ==="
          env -u CLW_TOKEN \
            CLW_REF_DOMAIN=runner \
            CLW_CRED_TICKET=faketicket123 \
            CLW_LEASE_ID=L1 \
            CLW_FABRIC_ENDPOINT=http://127.0.0.1:1 \
            CLW_ENDPOINT=http://127.0.0.1:1 \
            clw run --input someref -- true > /tmp/clwout 2>&1
          echo "--- clw output ---"; cat /tmp/clwout
          echo "=== VERDICT ==="
          if grep -qiE "redemption transport error|/v1/leases/L1/cas-cred|broker|cred.?ticket" /tmp/clwout; then
            echo "PROPAGATION-CHECK-RESULT: BROKER PATH — env trio reaches clw, propagation FINE (#2 rides #1)"
          elif grep -qiE "missing token" /tmp/clwout; then
            echo "PROPAGATION-CHECK-RESULT: MISSING TOKEN — trio NOT reaching clw child, real propagation gap"
          else
            echo "PROPAGATION-CHECK-RESULT: UNCLEAR — inspect the clw output above"
          fi
