# Orphan-box detection — does the platform show a box our records do not?
#
# ── The gap this closes ──────────────────────────────────────────────────────
#
# PR #486 shipped `reapStaleBoxes`, which destroys boxes that outlive their own
# bookkeeping. It enumerates the durable `sbox:` records written at spawn time.
# The three boxes that leaked for 10.2 h on 2026-08-23 HAD NO SUCH RECORD. A
# layer whose entire job is catching bookkeeping loss cannot start from the
# bookkeeping — it is structurally incapable of catching the failure it exists
# for.
#
# This workflow starts from the only source that cannot lose a box: the
# Cloudflare Containers API. Whatever is running IS running, recorded or not.
#
# ── DETECTION ONLY, and not by choice ────────────────────────────────────────
#
# ⛔ There is no path from a CF Containers instance back to its Durable Object.
# Instance names are bare UUIDs; fabric handles are `crypto.randomUUID()` minted
# per spawn attempt, and the two namespaces are disjoint. `POST /v1/teardown`
# with an instance name resolves `idFromName()` to a fresh unrelated DO, destroys
# nothing, and returns 204 — a silent no-op that reads as success. So this
# workflow issues GETs and nothing else: it never stops, destroys, or rolls
# anything. The fix for the kill half is
# docs/adr/0010-enumerable-runner-do-names.md and is deliberately not built yet.
#
# ── Why a cron is legitimate here ────────────────────────────────────────────
#
# The repo rule is that a cron earns its keep ONLY when something can change
# WITHOUT a commit. Running prod instance state is the textbook case: a box leaks
# because of what happened at runtime, on a day with no commits at all. Nothing
# about this can be answered on a PR trigger.
#
# Cadence is every 2 h against a 3 h over-age threshold, so a leaked box is
# surfaced by the time it is ~5 h old. Before this existed the answer was 10.2 h
# and only because a human went looking. Each run leases one ephemeral box for
# ~30 s; the leak class it watches for costs ~120 vCPU-hours per incident.
#
# ── Arming it ────────────────────────────────────────────────────────────────
#
# Required repo secrets:
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_CONTAINERS_API_TOKEN  — NOT CLOUDFLARE_API_TOKEN. A different
#                                      token; only this one carries containers
#                                      read. Never echoed, only referenced.
# Optional (enables the second signal; without it only the age signal runs):
#   FLEET_BUSY_READ_KEY              — the spawn-Worker's ops-READ key, already
#                                      used by scripts/ci/wait-for-idle-fleet.sh.
name: orphan-box-detect

on:
  schedule:
    # Every 2 hours at :20 — offset from canary-smoke (:00) so the two do not
    # contend for the fleet at the same instant.
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      max_lease_hours:
        description: 'Over-age threshold in hours (default 3 = 2h max lease + 1h grace)'
        required: false
        default: '3'

permissions:
  contents: read

# Never let two sweeps overlap: a second box in flight is a second instance in
# the very count this workflow is trying to read.
concurrency:
  group: orphan-box-detect
  cancel-in-progress: false

jobs:
  detect:
    # Self-hosted ephemeral CoreLink box — never GitHub-hosted. curl + jq are
    # baked into the runner image (deploy/runner/Dockerfile).
    runs-on: corelink
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      # The fabric's own count of boxes it has bindings for. Best-effort by
      # design: this is the SECOND signal, and the first one (age) needs no
      # bookkeeping at all — which is the whole point. If the endpoint is not
      # armed we run with the age signal alone rather than failing the sweep,
      # because a partial check still catches the measured incident.
      - name: Read the fabric's accounted-box count
        id: accounted
        env:
          FLEET_BUSY_READ_KEY: ${{ secrets.FLEET_BUSY_READ_KEY }}
          FLEET_BUSY_URL: https://corelink-spawn-worker.gmhelmold.workers.dev/internal/v1/fleet/busy
        run: |
          set -uo pipefail
          if [ -z "${FLEET_BUSY_READ_KEY}" ]; then
            echo "::warning::FLEET_BUSY_READ_KEY is not set — running the age signal only."
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          body="$(curl -s --max-time 20 -H "x-corelink-internal-auth: ${FLEET_BUSY_READ_KEY}" "${FLEET_BUSY_URL}")"
          checked="$(printf '%s' "$body" | jq -r '.checked // empty' 2>/dev/null)"
          if [ -z "${checked}" ]; then
            echo "::warning::fleet/busy gave no usable .checked — running the age signal only."
            echo "value=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "fabric accounts for ${checked} box binding(s)"
          echo "value=${checked}" >> "$GITHUB_OUTPUT"

      # The check itself. Read-only: it only ever issues GETs against the
      # Containers API. A non-zero exit here is the page.
      - name: Diff platform truth against the fabric's bookkeeping
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_CONTAINERS_API_TOKEN: ${{ secrets.CLOUDFLARE_CONTAINERS_API_TOKEN }}
          MAX_LEASE_HOURS: ${{ inputs.max_lease_hours || '3' }}
          ACCOUNTED: ${{ steps.accounted.outputs.value }}
        run: |
          set -euo pipefail
          args=(--max-lease-hours "${MAX_LEASE_HOURS}")
          if [ -n "${ACCOUNTED}" ]; then
            args+=(--accounted "${ACCOUNTED}")
          fi
          bash scripts/orphan-box-check.sh "${args[@]}"

      # Runs even when the check above failed, so the page carries the operator's
      # next move instead of just an exit code.
      - name: What to do about it
        if: failure()
        run: |
          echo "A running box is unaccounted for or has outlived the fabric's own lease."
          echo
          echo "⛔ Do NOT teardown by instance name — it is a silent 204 no-op that"
          echo "   destroys nothing (measured 2026-08-23)."
          echo
          echo "Today's only lever that removes a running box is an image roll,"
          echo "which kills in-flight jobs on the OTHER boxes. Gate it behind"
          echo "scripts/ci/wait-for-idle-fleet.sh, and read"
          echo "docs/runbook/incident-playbook.md before acting."
          echo
          echo "The durable fix — enumerable Durable Object names, so any running"
          echo "instance maps back to a DO without bookkeeping — is specified in"
          echo "docs/adr/0010-enumerable-runner-do-names.md and needs owner sign-off."
