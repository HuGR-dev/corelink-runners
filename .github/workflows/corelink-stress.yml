# Validation campaign — Phase 2 (E4) LIVE concurrency STRESS.
# Dispatches N concurrent `runs-on: corelink` jobs to prove the atomic concurrency
# slot + fleet cap hold under real load: the slot admits <= the cap, refuses the
# overflow (spawn_at_ceiling / rate_limited), the reconciler re-drives the queued
# overflow as slots free, and ALL jobs eventually complete — no thrash, no deadlock.
# Evidence = the /internal/v1/metrics counter deltas + every job reaching success.
# Manual-only; each job holds a runner slot for ~HOLD_SECONDS so concurrency is real.
name: corelink-stress
on:
  workflow_dispatch:
    inputs:
      count:
        description: "number of concurrent corelink jobs to spawn"
        default: "40"
      hold_seconds:
        description: "seconds each job holds its runner slot"
        default: "25"

permissions:
  contents: read

jobs:
  # Generate a [1..count] matrix on the CoreLink fleet.
  setup:
    runs-on: corelink
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
      - id: gen
        env:
          COUNT: ${{ inputs.count }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: |
          set -euo pipefail
          bash scripts/ci/stress-inputs.sh validate
          bash scripts/ci/stress-inputs.sh matrix >> "$GITHUB_OUTPUT"

  # The concurrent corelink jobs — each spawns an ephemeral runner + holds its slot.
  stress:
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix:
        n: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: corelink
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
      - name: validate stress inputs
        env:
          COUNT: ${{ inputs.count }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        run: bash scripts/ci/stress-inputs.sh validate
      - name: hold the slot
        env:
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          echo "stress job ${{ matrix.n }} on $(hostname) at $(date -u +%FT%TZ)"
          sleep "$HOLD_SECONDS"
          echo "stress job ${{ matrix.n }} done"

  # A skipped, cancelled, or failed prerequisite must make this workflow fail.
  # Cancelled or zero-job runs remain non-passing evidence; sprint acceptance
  # checks the actual run conclusion, not the presence of this result job.
  result-assertion:
    if: always()
    needs: [setup, stress]
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: require setup and stress success
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          STRESS_RESULT: ${{ needs.stress.result }}
        run: |
          set -euo pipefail
          if [[ "$SETUP_RESULT" != success || "$STRESS_RESULT" != success ]]; then
            printf 'corelink-stress failed: setup=%s stress=%s\n' "$SETUP_RESULT" "$STRESS_RESULT" >&2
            exit 1
          fi
