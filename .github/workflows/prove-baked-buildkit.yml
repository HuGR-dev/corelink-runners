# Proof gate for the WP-F1a fleet roll: assert the runner image now on the fleet
# carries BuildKit + runc BAKED — no fetch, no install. If this job's lease boots
# from the repinned image (@sha256:26feb902…), the three binaries are already on
# PATH and `--version` succeeds. A failure here means the roll did not take (or the
# lease booted an older pooled image) → rollback the spawn-worker pin to
# @sha256:f6d787b6… and redeploy.
name: prove-baked-buildkit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove:
    name: baked buildkitd/buildctl/runc are on PATH (no fetch)
    runs-on: corelink
    timeout-minutes: 10
    steps:
      - name: Assert baked binaries present + runnable
        run: |
          set -euo pipefail
          fail=0
          for bin in buildkitd buildctl runc; do
            if command -v "$bin" >/dev/null 2>&1; then
              printf '  ✓ %-9s %s\n' "$bin" "$(command -v "$bin")"
              "$bin" --version || { echo "::error::$bin present but --version failed"; fail=1; }
            else
              echo "::error::$bin NOT on PATH — baked image did not take on this lease"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "✓ fleet lease carries BuildKit+runc baked — WP-F1a roll PROVEN" || exit 1
