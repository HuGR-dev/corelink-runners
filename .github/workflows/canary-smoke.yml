# Continuous synthetic canary — is the LIVE path actually minting runners?
#
# Every hour this orchestrator dispatches the existing `corelink-smoke.yml`
# (a `runs-on: corelink` job that can ONLY land on a freshly-minted ephemeral
# CoreLink box — the product label) and WATCHES it to a conclusion. If the smoke
# does not reach `success` within the timeout — because the fabric stopped
# minting, the spawn-Worker is down, or the box never came up — this workflow
# goes RED, which fires GitHub's native failed-workflow notification.
#
# WHY a SEPARATE orchestrator instead of a bare scheduled `runs-on: corelink`
# job: a scheduled fleet job that never gets a box sits QUEUED and never trips
# `timeout-minutes` (that clock starts only once a job is RUNNING), so a dead
# fleet would go UNDETECTED. The orchestrator must therefore live in a DIFFERENT
# failure domain from the fleet it watches, so that "no box ever came" becomes a
# real wall-clock failure instead of silence. That property is the whole point of
# this workflow and must survive any change to it.
#
# WHY `corelink-dogfood` and no longer `ubuntu-latest` (2026-08-29): GH-hosted
# minutes are billing-blocked on this org, so the orchestrator stopped STARTING
# on 2026-08-24. It did not go loud — the job failed with zero steps executed,
# which reads as "canary red" and was written off as noise. Because this
# workflow is the ONLY dispatcher of `corelink-smoke.yml`, that smoke had not
# run for five days: the live minting path went completely unverified while the
# dashboard showed a red nobody trusted. A canary that cannot start is worse
# than no canary, because it looks like coverage.
#
# `corelink-dogfood` is the CI fleet (the founder's Mac), a different failure
# domain from the ephemeral CF boxes that carry the `corelink` product label —
# so the QUEUED-forever blindness above does not come back. RESIDUAL LIMITATION,
# stated rather than hidden: if the Mac itself is down, this canary goes silent
# the same way the hosted one did. Watching the watcher needs a probe outside
# GitHub entirely; that is not solved here.
#
# No owner secret is required to arm this — it uses the automatic GITHUB_TOKEN.
# It only produces meaningful results once the live fleet serves the `corelink`
# label; before then it will (correctly) go red, signalling the path is not live.
name: canary-smoke

on:
  schedule:
    # Top of every hour (30–60 min band; 60 keeps GH-hosted minutes low).
    - cron: '0 * * * *'
  workflow_dispatch: {}

# `gh workflow run` (dispatch corelink-smoke) + `gh run watch` need actions:write.
permissions:
  contents: read
  actions: write

jobs:
  canary:
    runs-on: corelink-dogfood
    # Hard wall-clock ceiling: if the smoke never starts or never finishes, the
    # job times out → red → notification.
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SMOKE_WORKFLOW: corelink-smoke.yml
      SMOKE_REF: main
    steps:
      # Self-hosted runners inherit the launchd service PATH, NOT an interactive
      # shell's. corelink-server's `okf-autoreconcile` lane died silently for
      # days at `claude: command not found` / exit 127 for exactly this reason.
      # Fail LOUD with a named cause instead of repeating that.
      - name: Preflight — gh must be on the runner PATH
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::canary: \`gh\` is not on this runner's PATH." \
                 "The launchd service PATH differs from an interactive shell's;" \
                 "install gh for the runner user or add it to the service PATH." \
                 "Refusing to run so this does not fail as an opaque exit 127."
            exit 1
          fi
          echo "gh: $(command -v gh) ($(gh --version | head -1))"

      - name: Dispatch corelink-smoke and watch it to a conclusion
        run: |
          set -euo pipefail

          # Newest existing run id for the smoke workflow BEFORE we dispatch, so
          # we can detect the NEW run (rather than watch a stale one).
          BEFORE="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${SMOKE_WORKFLOW}" \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          echo "latest smoke run before dispatch: ${BEFORE}"

          echo "dispatching ${SMOKE_WORKFLOW} on ${SMOKE_REF}…"
          gh workflow run "${SMOKE_WORKFLOW}" --repo "${GITHUB_REPOSITORY}" --ref "${SMOKE_REF}"

          # Poll for the new run to register (dispatch → run creation is async).
          RUN_ID=""
          for _ in $(seq 1 30); do
            sleep 6
            CUR="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${SMOKE_WORKFLOW}" \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "${CUR}" != "${BEFORE}" ] && [ "${CUR}" != "0" ]; then
              RUN_ID="${CUR}"
              break
            fi
          done

          if [ -z "${RUN_ID}" ]; then
            echo "::error::canary: ${SMOKE_WORKFLOW} did not register a new run within" \
                 "~3 min of dispatch — the workflow may be disabled or Actions is degraded."
            exit 1
          fi

          echo "watching smoke run ${RUN_ID}…"
          # --exit-status makes gh exit non-zero if the run concludes as anything
          # but success; the surrounding `set -e` then fails this step (→ red).
          # If the run hangs (e.g. no box ever provisions), the job-level
          # timeout-minutes trips instead.
          gh run watch "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --exit-status --interval 15
          echo "✅ canary: ${SMOKE_WORKFLOW} run ${RUN_ID} reached success — the live minting path is up."
