# release.yml — tag-triggered release pipeline
#
# Triggered ONLY on tags matching v* (e.g. v0.1.0). NEVER runs on PR or branch push.
# This means it cannot interfere with normal CI (ci.yml covers PR + main pushes).
#
# Jobs:
#   gate          — detects whether NPM_TOKEN / PYPI_TOKEN secrets are set.
#   binary        — builds corelink-cli for every target this repo can build
#                   CORRECTLY (see below), uploading each as a build artifact.
#   publish-release — downloads all `binary` artifacts, creates the GitHub
#                   Release, and attaches each binary + its sha256 checksum.
#   publish-npm   — publishes @corelink/verify to npm; SKIPPED (safe no-op) unless
#                   NPM_TOKEN secret is set by the owner.
#   publish-pypi  — publishes corelink-verify to PyPI; SKIPPED (safe no-op) unless
#                   PYPI_TOKEN secret is set by the owner.
#
# ── Target matrix + WHY (2026-08-16 rewrite) ──────────────────────────────────
# This repo has NO self-hosted macOS builder (unlike the sibling corelink-server
# / corelink-workspaces repos, which cross-build a full 5-target matrix — incl.
# aarch64-apple-darwin — via cargo-zigbuild on a `[self-hosted, mac, corelink-
# builder]` runner). corelink-runners only has the self-hosted `corelink`
# ephemeral Firecracker Linux fleet (the product's own dogfood compute, $0
# GitHub billing — see ci.yml). The PREVIOUS version of this job ran on
# `ubuntu-latest`, built native x86_64 Linux with no `--target`, and uploaded
# the result as `corelink-aarch64-apple-darwin` — a Linux ELF mislabeled as an
# Apple-Silicon Mach-O binary. Any macOS-ARM user who ran it would hit "Exec
# format error".
#
# Fix: build ONLY targets this fleet can produce correctly, and name each
# asset after the target it actually is:
#   corelink-x86_64-unknown-linux-gnu    — native build on the `corelink` fleet
#   corelink-aarch64-unknown-linux-gnu   — cross via cargo-zigbuild (zig
#                                          supplies the libc + linker; no native
#                                          hardware needed for a Linux target)
#   corelink-x86_64-pc-windows-gnu       — cross via cargo-zigbuild (same zig
#                                          cross-toolchain, gnu ABI)
# aarch64-apple-darwin (and any other Apple target) is NOT built here: cross-
# compiling to Apple targets needs the Apple SDK, which is not redistributable
# and not available on this fleet, and zigbuild-to-darwin-from-Linux is
# unproven anywhere in this org (the sibling repos only ever build darwin
# NATIVELY, on real Apple hardware). Follow-up: add a darwin leg once a
# self-hosted Mac builder exists for this repo (mirroring release-cli.yml /
# corelink-workspaces' release.yml) — see docs/release.md.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Reads the publish secrets in a `run` step (the ONLY place `secrets` is
  # allowed — NOT in a job/step `if:`) and emits booleans. Publish jobs then gate
  # on `needs.gate.outputs.*`, which IS valid in `if:`. This is the correct
  # skip-safe pattern: with no token the publish jobs are genuinely SKIPPED.
  gate:
    name: Detect publish secrets
    runs-on: corelink
    outputs:
      has_npm: ${{ steps.detect.outputs.has_npm }}
      has_pypi: ${{ steps.detect.outputs.has_pypi }}
    steps:
      - id: detect
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "has_npm=true" >> "$GITHUB_OUTPUT"; else echo "has_npm=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PYPI_TOKEN" ]; then echo "has_pypi=true" >> "$GITHUB_OUTPUT"; else echo "has_pypi=false" >> "$GITHUB_OUTPUT"; fi

  binary:
    name: build (${{ matrix.target.name }})
    # Self-hosted ephemeral Firecracker Linux fleet — $0 GitHub billing
    # (zero-hosted mandate). Each lease is a fresh microVM with its own
    # $HOME/$CARGO_HOME (see ci.yml), so the toolchain setup below runs
    # identically on a clean lease with no shared-registry cross-job race.
    runs-on: corelink
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The fleet has finite concurrent capacity (see CLAUDE.md runner-capacity
      # notes) — cap parallelism so a release doesn't starve other jobs.
      max-parallel: 2
      matrix:
        target:
          # Native build on the fleet's own host triple — no cross-toolchain.
          - triple: x86_64-unknown-linux-gnu
            name: corelink-x86_64-unknown-linux-gnu
            ext: ""
            zig: false
          # Cross via cargo-zigbuild: zig supplies the aarch64 libc + linker.
          - triple: aarch64-unknown-linux-gnu
            name: corelink-aarch64-unknown-linux-gnu
            ext: ""
            zig: true
          # Cross via cargo-zigbuild: zig supplies the gnu-ABI Windows libc +
          # linker (no Apple SDK involved — safe to cross from Linux).
          - triple: x86_64-pc-windows-gnu
            name: corelink-x86_64-pc-windows-gnu
            ext: ".exe"
            zig: true
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          shared-key: release-${{ matrix.target.triple }}

      - name: ensure cargo bin on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # zig, pinned + checksum-verified (no third-party setup-zig action — one
      # fewer supply-chain dependency to trust). Picks the tarball matching the
      # runner's own arch so this works whether the `corelink` fleet host is
      # x86_64 or aarch64.
      - name: Install zig (pinned 0.13.0, checksum-verified)
        if: matrix.target.zig
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              ZIG_TAR="zig-linux-x86_64-0.13.0.tar.xz"
              ZIG_SHA="d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea"
              ;;
            aarch64|arm64)
              ZIG_TAR="zig-linux-aarch64-0.13.0.tar.xz"
              ZIG_SHA="041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556"
              ;;
            *)
              echo "::error::unsupported host arch $(uname -m) for zig install" >&2
              exit 1
              ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.13.0/${ZIG_TAR}" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA}  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.zig"
          tar -xf /tmp/zig.tar.xz -C "$HOME/.zig" --strip-components=1
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      # Prebuilt binary, NOT `cargo install` — avoids compiling into a shared
      # registry (the documented os-error-2 class of race on shared-$HOME
      # fleets). Same version pin proven in the sibling repos' release
      # pipelines.
      - name: Install cargo-zigbuild (prebuilt)
        if: matrix.target.zig
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-zigbuild@0.19.8

      # cargo-zigbuild caches zigcc wrapper scripts and a tar-restore (rust-
      # cache) can land them without the execute bit — guard against the
      # exit-126 class before it bites (proven fix, sibling repos' recipe).
      - name: Fix zigcc linker-script permissions (exit-126 guard)
        if: matrix.target.zig
        run: |
          CACHE_DIR="$HOME/.cache/cargo-zigbuild"
          if [ -d "$CACHE_DIR" ]; then
            find "$CACHE_DIR" -name '*.sh' -exec chmod +x {} +
          fi

      - name: Build (cargo build, native)
        if: ${{ !matrix.target.zig }}
        run: cargo build -p corelink-cli --release --locked --target "${{ matrix.target.triple }}"

      - name: Build (cargo zigbuild, cross)
        if: matrix.target.zig
        run: cargo zigbuild -p corelink-cli --release --locked --target "${{ matrix.target.triple }}"

      - name: Prepare artifact (rename + sha256 checksum)
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/${{ matrix.target.triple }}/release/corelink${{ matrix.target.ext }}"
          ASSET="${{ matrix.target.name }}${{ matrix.target.ext }}"
          mkdir -p out
          cp "$SRC" "out/${ASSET}"
          (cd out && sha256sum "${ASSET}" > "${ASSET}.sha256")
          ls -la out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.target.name }}
          path: out/
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    needs: binary
    runs-on: corelink
    timeout-minutes: 15
    permissions:
      contents: write   # required to create the GH Release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Verify artifact count (expect 6 = 3 binaries + 3 checksums)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== dist/ contents ==="
          find dist/ -maxdepth 1 -type f | sort
          EXPECTED=6
          ACTUAL=$(find dist/ -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::expected ${EXPECTED} files, got ${ACTUAL}" >&2
            exit 1
          fi

      - name: Create GitHub Release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "corelink ${TAG}" \
            --generate-notes \
            --verify-tag \
            || true
          gh release upload "${TAG}" dist/* --clobber

  publish-npm:
    name: Publish @corelink/verify to npm
    runs-on: ubuntu-latest
    # SAFE NO-OP: skipped entirely when NPM_TOKEN is absent (gate output is
    # 'false'). The owner opts in by adding NPM_TOKEN in repo Settings → Secrets.
    needs: gate
    if: needs.gate.outputs.has_npm == 'true'
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install --ignore-scripts
          # --access restricted keeps @corelink/verify private-scoped.
          # Owner decision: change to --access public when @corelink org is
          # registered on npmjs and public distribution is confirmed.
          npm publish --access restricted

  publish-pypi:
    name: Publish corelink-verify to PyPI
    runs-on: ubuntu-latest
    # SAFE NO-OP: skipped entirely when PYPI_TOKEN is absent (gate output is
    # 'false'). The owner opts in by adding PYPI_TOKEN in repo Settings → Secrets.
    needs: gate
    if: needs.gate.outputs.has_pypi == 'true'
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Upload to PyPI
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
