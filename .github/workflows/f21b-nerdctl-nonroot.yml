# F2.1b — the customer writes BARE `docker build` (no sudo) as the non-root job
# user. F2.1 proved `sudo docker`(nerdctl) works; rootful containerd is NOT
# reachable by the unprivileged user via socket perms alone (namespace/dir).
# SOTA-pragmatic drop-in: ship `docker` as a thin wrapper that execs
# `sudo nerdctl` — the lease has passwordless sudo and the per-lease Firecracker
# microVM IS the isolation boundary (same root-in-microVM model our own prod
# build already uses with `sudo buildctl`). The wrapper hides the sudo so the
# customer's unmodified `docker build`/`docker push` steps never say it, and it
# forwards DOCKER_CONFIG so `docker login`→build→push share one credential file.
name: f21b-nerdctl-nonroot

on:
  push:
    branches: [proof/f21b-nerdctl-nonroot]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd
  DOCKER_CONFIG: /home/runner/.docker

jobs:
  prove:
    name: BARE `docker build` then `docker push` via docker→sudo-nerdctl wrapper
    runs-on: corelink
    timeout-minutes: 30
    steps:
      - name: Confirm we are NOT root
        run: |
          set -euo pipefail
          echo "whoami=$(whoami) uid=$(id -u)"
          [ "$(id -u)" -ne 0 ] || { echo "::error::job runs as root — this probe is meaningless"; exit 1; }

      - name: Fetch nerdctl-full v2.3.5 (pinned) + install the `docker` wrapper
        run: |
          set -euo pipefail
          VER=2.3.5
          SHA=b697295c623639734aaab737523c808fd3cc8d3046039fd94fff1744e4c317aa
          curl -fsSL -o /tmp/nf.tgz "https://github.com/containerd/nerdctl/releases/download/v${VER}/nerdctl-full-${VER}-linux-amd64.tar.gz"
          echo "${SHA}  /tmp/nf.tgz" | sha256sum -c -
          sudo tar -C /usr/local -xzf /tmp/nf.tgz
          # The drop-in shim: `docker` = sudo nerdctl, forwarding the config + daemon
          # addresses so the unprivileged user's bare `docker …` just works.
          sudo tee /usr/local/bin/docker >/dev/null <<'WRAP'
          #!/bin/sh
          exec sudo DOCKER_CONFIG="${DOCKER_CONFIG:-/home/runner/.docker}" \
                    BUILDKIT_HOST="unix:///run/buildkit/buildkitd.sock" \
                    CONTAINERD_ADDRESS="/run/containerd/containerd.sock" \
                    /usr/local/bin/nerdctl "$@"
          WRAP
          sudo chmod 0755 /usr/local/bin/docker
          docker --version

      - name: Start containerd + buildkitd (root)
        run: |
          set -uo pipefail
          sudo sh -c 'containerd >/tmp/containerd.log 2>&1 &'
          sudo sh -c 'buildkitd --addr unix:///run/buildkit/buildkitd.sock >/tmp/buildkitd.log 2>&1 &'
          for i in $(seq 1 40); do
            sudo test -S /run/containerd/containerd.sock && sudo test -S /run/buildkit/buildkitd.sock && { echo "up ${i}s"; break; }
            sleep 1
          done
          docker info >/dev/null 2>&1 && echo "bare (wrapper) docker↔containerd OK as $(whoami)" || { echo "::error::wrapper docker cannot reach containerd"; sudo tail -30 /tmp/containerd.log; exit 1; }

      - name: `docker login`-equivalent — write the USER's docker config
        run: |
          set -euo pipefail
          CRED="$(npx -y wrangler@4.111.0 containers registries credentials registry.cloudflare.com --push --pull --expiration-minutes 25 --json 2>/dev/null)"
          U=$(echo "$CRED" | jq -r '.username'); P=$(echo "$CRED" | jq -r '.password')
          [ -n "$U" ] && [ -n "$P" ] || { echo "::error::cred mint failed"; exit 1; }
          AUTH=$(printf '%s:%s' "$U" "$P" | base64 | tr -d '\n')
          mkdir -p "$HOME/.docker"
          printf '{"auths":{"registry.cloudflare.com":{"auth":"%s"}}}' "$AUTH" > "$HOME/.docker/config.json"
          echo "F21_REF=registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/f21b-nonroot-proof:run-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: The proof — BARE `docker build` then `docker push` (no sudo typed)
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/ctx"; mkdir -p "$B"
          cat > "$B/Dockerfile" <<'EOF'
          FROM ubuntu:24.04
          RUN echo "bare-nonroot-docker-on-corelink" > /marker.txt
          EOF
          echo "── docker build (bare, as $(whoami)) ──"
          docker build -t "$F21_REF" "$B"
          echo "── docker push (bare, separate process) ──"
          docker push "$F21_REF"
          echo "✓ BARE docker build→push works for the non-root user via the wrapper — true drop-in contract holds"

      - name: Delete the scratch tag (zero bleed)
        if: always()
        run: |
          set +e
          yes | npx -y wrangler@4.111.0 containers images delete "f21b-nonroot-proof:run-${GITHUB_RUN_ID}" 2>&1 | tail -6
