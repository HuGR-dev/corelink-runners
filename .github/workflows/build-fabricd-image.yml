# Build + push the corelink-fabricd control-plane image to the Cloudflare managed
# registry — on a GitHub-hosted runner, with NO local Docker daemon.
#
# WHY THIS EXISTS: fabricd's image was built with a LOCAL `wrangler containers
# build ../..` that needs a Docker daemon on the operator's machine. That local
# step hung once and blocked a go-live. This workflow moves the build onto a
# GH-hosted `ubuntu-latest` runner (Docker + buildx preinstalled) so no operator
# laptop is ever in the deploy loop.
#
# WHAT IT DOES:
#   1. `docker buildx build` the fabricd binary image from
#      `crates/corelink-fabric-server/Dockerfile` with the repo ROOT as context
#      (the Dockerfile does `COPY . .`; the root `.dockerignore` keeps target/ +
#      .git out). X4 supply-chain floor: the Dockerfile FROMs are already
#      @sha256-pinned — this workflow does NOT unpin them.
#   2. Push the built image to the Cloudflare managed registry via
#      `wrangler containers push` (wrangler holds the registry credential; it
#      authenticates from CLOUDFLARE_API_TOKEN — no `docker login` to
#      registry.cloudflare.com needed).
#   3. Emit the pushed `@sha256:` digest as a job output AND to the run summary,
#      with the exact line to pin in wrangler.jsonc.
#
# IT DELIBERATELY DOES NOT deploy or auto-commit the digest. Rolling a new
# control-plane binary is a reviewed, two-step human action (see the summary this
# emits): (1) pin the digest in deploy/cloudflare-fabricd/wrangler.jsonc
# containers[].image, (2) `cd deploy/cloudflare-fabricd && npx wrangler deploy`
# (a NEW digest forces the container rollout; a config-only change does not).
#
# ── OWNER DEPENDENCY (to arm) ────────────────────────────────────────────────
#   GH SECRET `CLOUDFLARE_API_TOKEN` — a Cloudflare API token with
#   Containers/Workers push scope for account
#   6a1fc1c626fc2628823e60b9db01f5cd. The job guards on it (fails fast if absent).
name: build-fabricd-image

on:
  # Manual-only: the control-plane image changes rarely and a build is heavy;
  # dispatch it when the fabricd binary / its Dockerfile actually change
  # (`gh workflow run build-fabricd-image.yml`).
  workflow_dispatch:
    inputs:
      image_name:
        description: >-
          Managed-registry image name to push to. Defaults to the live one.
          Override it to publish IDENTICAL content under a second name — the
          control that separates "this image cannot run" from "this registry
          path cannot be pulled", which is otherwise unfalsifiable from outside.
        required: false
        default: corelink-fabricd-fabricdcontainer
      dockerfile:
        description: >-
          Dockerfile to build. Defaults to the production one. Override it only
          for a diagnostic image (Dockerfile.bootprobe), which must never be
          pinned in a steady deploy.
        required: false
        default: crates/corelink-fabric-server/Dockerfile

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 6a1fc1c626fc2628823e60b9db01f5cd
  # Bare image name — matches the live image's name; wrangler prefixes the
  # account managed-registry path on push (registry.cloudflare.com/<acct>/<name>).
  IMAGE_NAME: ${{ inputs.image_name || 'corelink-fabricd-fabricdcontainer' }}
  DOCKERFILE: ${{ inputs.dockerfile || 'crates/corelink-fabric-server/Dockerfile' }}

jobs:
  build-and-push:
    # Self-hosted `corelink` (zero-hosted mandate; the hosted lane is dead under
    # the billing block). amd64-native + baked nerdctl/buildkit + docker-shim +
    # Node — same daemonless chain as build-cf-container-images.yml.
    runs-on: corelink
    timeout-minutes: 60
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - name: Guard — require the CLOUDFLARE_API_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GH secret CLOUDFLARE_API_TOKEN — a Cloudflare API" \
                 "token with Containers/Workers push scope for account" \
                 "${CLOUDFLARE_ACCOUNT_ID} is required. Set it in repo Settings →" \
                 "Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install deps (wrangler)
        working-directory: deploy/cloudflare-fabricd
        run: npm ci

      - name: Sanity — the docker shim (nerdctl/buildkit) answers
        run: docker version

      # Plain `docker build` (the shim runs nerdctl/buildkit into the containerd
      # image store — no buildx, no daemon). Context = repo ROOT (COPY . .);
      # Dockerfile = crates/corelink-fabric-server/Dockerfile. The FROMs are
      # @sha256-pinned in that Dockerfile — X4 floor, left intact.
      - name: Build fabricd image (docker build)
        run: |
          set -euo pipefail
          docker build \
            --file "${DOCKERFILE}" \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" \
            .

      # Push the locally-built image to the CF managed registry. wrangler reads
      # CLOUDFLARE_API_TOKEN from the env and mints the registry credential — no
      # `docker login registry.cloudflare.com` required. Capture the pushed
      # `@sha256:` reference for pinning.
      - name: Push to Cloudflare managed registry
        id: push
        working-directory: deploy/cloudflare-fabricd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          IMG="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${IMAGE_NAME}"
          OUT="$(npx wrangler containers push "${IMAGE_NAME}:${GITHUB_SHA}" 2>&1 | tee /dev/stderr)"
          # Resolve the pushed image's @sha256 DIGEST for an immutable X4 pin, in
          # order of preference; each step is best-effort and the next covers it.
          # 1. The push output may already carry the …@sha256:… ref.
          REF="$(printf '%s\n' "${OUT}" | grep -oE 'registry\.cloudflare\.com/[^ ]+@sha256:[0-9a-f]{64}' | head -n1 || true)"
          # 2. Resolve the just-pushed tag's manifest digest from the registry.
          #    `wrangler containers push` authenticates docker to the managed
          #    registry, so `imagetools inspect` can read the manifest here even
          #    though a cold shell cannot. Any failure ⇒ empty ⇒ fall through.
          if [ -z "${REF}" ]; then
            DIGEST="$(docker buildx imagetools inspect "${IMG}:${GITHUB_SHA}" --format '{{ .Manifest.Digest }}' 2>/dev/null || true)"
            if printf '%s' "${DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
              REF="${IMG}@${DIGEST}"
              echo "resolved @sha256 digest via imagetools: ${REF}"
            fi
          fi
          # 3. Last resort: pin the immutable git-SHA TAG (CI-pushed, content-derived
          #    name ⇒ stable) — functional, but re-pin @sha256 once resolvable.
          if [ -z "${REF}" ]; then
            echo "::warning::Could not resolve an @sha256 digest (push output + imagetools both empty)." \
                 "Pinning the git-SHA tag; re-pin @sha256 when resolvable."
            REF="${IMG}:${GITHUB_SHA}"
          fi
          echo "ref=${REF}" >> "${GITHUB_OUTPUT}"
          echo "fabricd image pushed: ${REF}"

      - name: Summary — how to pin + roll the new fabricd binary
        run: |
          {
            echo "### corelink-fabricd image pushed"
            echo ""
            echo "**Pushed ref**"
            echo '```'
            echo "${{ steps.push.outputs.ref }}"
            echo '```'
            echo ""
            echo "**Two-step roll (reviewed; NOT automated):**"
            echo ""
            echo "1. Pin it in \`deploy/cloudflare-fabricd/wrangler.jsonc\` →" \
                 "\`containers[].image\`:"
            echo '```jsonc'
            echo "\"image\": \"${{ steps.push.outputs.ref }}\","
            echo '```'
            echo "2. Roll the container (a NEW digest forces the rollout):"
            echo '```sh'
            echo "cd deploy/cloudflare-fabricd && npx wrangler deploy"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
