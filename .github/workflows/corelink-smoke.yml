# CoreLink product-label smoke — prove 'runs-on: corelink' (the PRODUCT label,
# what a real external customer writes) gets an ephemeral runner.
#
# The dogfood-smoke proves the internal 'corelink-dogfood' label; THIS proves the
# bare product label 'corelink', which the autoscaler now serves via the
# 'corelink' label FAMILY (matchManagedLabel — the prior hard 'corelink-dogfood'
# default dropped it as "not our label", a first-external-customer blocker).
# Manually dispatched.
name: corelink-smoke

on:
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: corelink
    steps:
      - name: Where am I running
        run: |
          echo "=== CoreLink ephemeral runner — product label corelink ==="
          echo "runner name : ${RUNNER_NAME:-<unset>}"
          echo "host        : $(uname -a)"
      - name: Proof
        run: echo "OK - a runs-on corelink job ran on a CoreLink Runners ephemeral box; the product label is served."
