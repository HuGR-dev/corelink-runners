# Deploy the CoreLink spawn-Worker (deploy/cloudflare/) to Cloudflare.
#
# The spawn-Worker is a pure TS Worker + Container-DO bindings; `wrangler deploy`
# ships it with NO Docker daemon (the container IMAGES it references are built +
# pushed separately by build-cf-container-images.yml / build-fabricd-image.yml).
#
# SAFETY POSTURE (owner mandate — nothing auto-arms on a merge):
#   - MANUAL-ONLY (`workflow_dispatch`). There is deliberately NO push-to-main
#     trigger: a Cloudflare deploy is a production action and stays a human
#     decision (mirrors the repo's "never gh pr merge --auto" discipline).
#   - The deploy job is GATED behind the `test` job (spawn-Worker vitest +
#     typecheck) — a red test blocks the deploy.
#   - The deploy job FAILS FAST with a clear message if the `CLOUDFLARE_API_TOKEN`
#     secret is absent, so a dispatch before the owner arms the token cannot
#     silently no-op.
#   - The deploy job REFUSES TO ROLL A BUSY FLEET. `wrangler deploy` rolls the
#     `RunnerContainer` class; Cloudflare then SIGTERMs each container, allows up
#     to 15 minutes, and SIGKILLs. Since #495 the box honours that signal, but a
#     customer job longer than 15 minutes still dies mid-flight. So immediately
#     before `wrangler deploy` this workflow asks THE SPAWN-WORKER how many
#     fabric runners are executing customer work, and waits for zero — see the
#     `Gate` step below.
#     GITHUB is still the authority (never our own KV bookkeeping, which is what
#     has been wrong before); the Worker is simply the only party that can ASK.
#     Reading a repo's self-hosted runners needs `administration: read` across
#     every repo in RECONCILER_REPOS, which the Actions GITHUB_TOKEN does not
#     carry and cannot be granted cross-repo, and GitHub exposes no API to mint a
#     PAT (`POST /user/tokens` and `POST /user/personal-access-tokens` both 404).
#     The Worker already holds the GitHub App credential and already asks GitHub
#     per runner (`fleetBusySnapshot` / `keepAliveLiveRunners`), so the gate asks
#     it instead — needing no GitHub permission at all.
#     NOTE this is a REFUSAL, not a drain. Nothing drains a busy container, and
#     `rollout_active_grace_period` is NOT a drain either: it protects instances
#     connected to their DO for FEWER than N seconds (young-instance protection).
#
# ── ⚠️ BOOTSTRAP — THE FIRST DEPLOY CARRYING THE ENDPOINT NEEDS force: true ───
#   The gate now depends on the Worker it gates. `/internal/v1/fleet/busy` does
#   not exist in production until the deploy that ships it lands, so THAT one
#   dispatch must set `force: true`; the gate would otherwise get a 404 and,
#   correctly, refuse. Under force the read is attempted anyway and the outcome
#   is stated loudly — it never reports a clean idle verdict it did not get.
#   Every deploy after the first gates normally.
#
# ── OWNER DEPENDENCY (to arm) ────────────────────────────────────────────────
#   GH SECRET `CLOUDFLARE_API_TOKEN` — a Cloudflare API token with Workers deploy
#   scope for account 6a1fc1c626fc2628823e60b9db01f5cd. Set it in repo
#   Settings → Secrets and variables → Actions. Until then this workflow's
#   `test` job runs green but `deploy` fails fast with an explicit message.
#
#   GH SECRET `FLEET_BUSY_READ_KEY` — the spawn-Worker's dedicated ops-READ key,
#   the SAME value armed on the Worker with
#   `wrangler secret put FLEET_BUSY_READ_KEY`. It is its own credential on
#   purpose: ops-READ is a separate domain from spawn-CONTROL, and this one lives
#   in a GitHub Actions secret — a wider blast radius — so it must be rotatable
#   without breaking spawn. Unset on the Worker ⇒ the route 404s ⇒ the gate fails
#   with an explicit message. `force: true` is the deliberate override.
#   NO GitHub permission is required by the gate any more; the previous
#   `FLEET_RUNNERS_READ_TOKEN` (`administration: read`) is GONE — it could never
#   be minted, which is what made every deploy refuse.
name: deploy-spawn-worker

on:
  workflow_dispatch:
    inputs:
      poll_interval_secs:
        description: "Busy-fleet gate: seconds between polls of the spawn-Worker's fleet-busy endpoint."
        required: false
        # 30s. Each poll costs the WORKER one GitHub read per live box (capped at
        # 40), not this job; a full 45-minute wait is ~90 polls, and 30s is far
        # finer than the minutes-long granularity of a runner job finishing.
        default: "30"
      deadline_secs:
        description: "Busy-fleet gate: give up (and FAIL) after this many seconds."
        required: false
        # 2700s = 45 min. A `runs-on: corelink` job here legitimately runs tens of
        # minutes (the Rust PR gates run 10-30 min; the image builds set
        # timeout-minutes up to 120), so anything much shorter would fail while
        # perfectly normal work is still running. 45 min covers the overwhelming
        # majority without hanging a production deploy for hours — and the failure
        # is recoverable by simply re-dispatching. MUST stay under the deploy job's
        # timeout-minutes (60) or GitHub cancels the job before the gate can
        # report its verdict; the script enforces that bound.
        default: "2700"
      force:
        description: "DANGEROUS: skip the wait and roll over runners that are executing customer jobs. REQUIRED for the first deploy that ships /internal/v1/fleet/busy (see BOOTSTRAP in the header)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Narrow operator path for the write-only metrics key. This intentionally
  # does not invoke the deploy job, which would roll the container fleet.
  rotate-metrics:
    runs-on: corelink-builder
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install Wrangler
        run: npm ci

      - name: Guard rotation inputs
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          METRICS_OBSERVABILITY_KEY: ${{ secrets.METRICS_OBSERVABILITY_KEY }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1;
          }
          test -n "${METRICS_OBSERVABILITY_KEY:-}" || {
            echo "::error::Missing METRICS_OBSERVABILITY_KEY"; exit 1;
          }

      - name: Detect optional canary consumer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if npx wrangler secret list --name corelink-canary >/dev/null 2>&1; then
            echo "CANARY_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "CANARY_PRESENT=0" >> "$GITHUB_ENV"
          fi

      - name: Update spawn-worker metrics key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          METRICS_OBSERVABILITY_KEY: ${{ secrets.METRICS_OBSERVABILITY_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$METRICS_OBSERVABILITY_KEY" \
            | npx wrangler secret put METRICS_OBSERVABILITY_KEY --name corelink-spawn-worker

      - name: Probe aggregate-only production evidence
        working-directory: ${{ github.workspace }}
        env:
          METRICS_OBSERVABILITY_KEY: ${{ secrets.METRICS_OBSERVABILITY_KEY }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 \
            -H "X-Corelink-Internal-Auth: ${METRICS_OBSERVABILITY_KEY}" \
            "https://corelink-spawn-worker.gmhelmold.workers.dev/internal/v1/metrics")"
          count="$(printf '%s' "$body" | jq -er '
            .counters.capability_claim_unserved
            | if (type == "number" and . >= 0 and . == floor) then .
              else error("aggregate missing or invalid") end')"
          printf 'capability_claim_unserved=%s\n' "$count"

      - name: Update optional canary consumer
        if: env.CANARY_PRESENT == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          METRICS_OBSERVABILITY_KEY: ${{ secrets.METRICS_OBSERVABILITY_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$METRICS_OBSERVABILITY_KEY" \
            | npx wrangler secret put METRICS_OBSERVABILITY_KEY --name corelink-canary

  # Gate: the spawn-Worker's own test suite must pass before we deploy it.
  # Self-hosted `corelink` (zero-hosted mandate): the hosted ubuntu-latest lane is
  # dead under the billing block. Node 22 is baked into the runner image + on PATH,
  # so no actions/setup-node is needed; checkout resolves from the baked
  # action-archive cache (0 codeload).
  test:
    if: false
    runs-on: corelink
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

  deploy:
    if: false
    needs: test
    runs-on: corelink
    permissions:
      # `administration: read` used to be here for the busy-fleet gate. It is gone
      # on purpose: the gate asks the spawn-Worker now, so it needs NO GitHub
      # permission — and the permission was never sufficient anyway (it is
      # this-repo-only, while the fleet spans every repo in RECONCILER_REPOS).
      contents: read
    # Must outlast `deadline_secs` (default 2700s = 45 min) so a still-busy fleet
    # produces the gate's explicit verdict rather than a bare "cancelled".
    timeout-minutes: 60
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - name: Guard — require the CLOUDFLARE_API_TOKEN secret
        # Runs BEFORE checkout, so override the job's `deploy/cloudflare` default
        # working-directory (that path doesn't exist until checkout → "No such file
        # or directory") to the always-present workspace root.
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GH secret CLOUDFLARE_API_TOKEN — a Cloudflare API" \
                 "token with Workers deploy scope is required to deploy the" \
                 "spawn-Worker. Set it in repo Settings → Secrets and variables →" \
                 "Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install deps (wrangler)
        run: npm ci

      # ── Busy-fleet gate — the roll must not start while boxes hold live work ──
      # Runs HERE, as the last step before the deploy, rather than as a separate
      # job: a gate that passes and then hands off to another job leaves a window
      # in which the fleet picks up new work again.
      - name: Gate — refuse to roll while the fleet is busy
        working-directory: ${{ github.workspace }}
        env:
          # The spawn-Worker's dedicated ops-READ key — the gate's ONLY credential.
          # No GitHub token is involved: see the header. Absent ⇒ the gate fails
          # fast with an explicit message (unless force: true, the bootstrap).
          FLEET_BUSY_READ_KEY: ${{ secrets.FLEET_BUSY_READ_KEY }}
          POLL_INTERVAL_SECS: ${{ inputs.poll_interval_secs }}
          DEADLINE_SECS: ${{ inputs.deadline_secs }}
          FORCE: ${{ inputs.force }}
          # THIS job is itself running on a fabric box, which GitHub correctly
          # reports as busy. Without excluding it the gate waits on itself until
          # the deadline, every single time.
          EXCLUDE_RUNNERS: ${{ runner.name }}
        run: bash scripts/ci/wait-for-idle-fleet.sh

      - name: Guard — reject Option-C map depletion
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/ci/check-repo-tenant-pat-map.mjs deploy/cloudflare/wrangler.jsonc

      - name: Deploy (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy
