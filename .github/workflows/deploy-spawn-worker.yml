# Deploy the CoreLink spawn-Worker (deploy/cloudflare/) to Cloudflare.
#
# The spawn-Worker is a pure TS Worker + Container-DO bindings; `wrangler deploy`
# ships it with NO Docker daemon (the container IMAGES it references are built +
# pushed separately by build-cf-container-images.yml / build-fabricd-image.yml).
#
# SAFETY POSTURE (owner mandate — nothing auto-arms on a merge):
#   - MANUAL-ONLY (`workflow_dispatch`). There is deliberately NO push-to-main
#     trigger: a Cloudflare deploy is a production action and stays a human
#     decision (mirrors the repo's "never gh pr merge --auto" discipline).
#   - The deploy job is GATED behind the `test` job (spawn-Worker vitest +
#     typecheck) — a red test blocks the deploy.
#   - The deploy job FAILS FAST with a clear message if the `CLOUDFLARE_API_TOKEN`
#     secret is absent, so a dispatch before the owner arms the token cannot
#     silently no-op.
#
# ── OWNER DEPENDENCY (to arm) ────────────────────────────────────────────────
#   GH SECRET `CLOUDFLARE_API_TOKEN` — a Cloudflare API token with Workers deploy
#   scope for account 6a1fc1c626fc2628823e60b9db01f5cd. Set it in repo
#   Settings → Secrets and variables → Actions. Until then this workflow's
#   `test` job runs green but `deploy` fails fast with an explicit message.
name: deploy-spawn-worker

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Gate: the spawn-Worker's own test suite must pass before we deploy it.
  # Runs on GH-hosted ubuntu-latest — self-contained TS, needs no CoreLink fleet
  # and no secrets.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest)
        run: npm run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - name: Guard — require the CLOUDFLARE_API_TOKEN secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GH secret CLOUDFLARE_API_TOKEN — a Cloudflare API" \
                 "token with Workers deploy scope is required to deploy the" \
                 "spawn-Worker. Set it in repo Settings → Secrets and variables →" \
                 "Actions, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (wrangler)
        run: npm ci

      - name: Deploy (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deploy
