# O7 G2 — the live cloud-metadata probe (clw coordinator P0 #3). Runs INSIDE a
# real corelink-dogfood runner lease (a CF container box spawned by the
# autoscaler) and asserts the raw reachability of the cloud metadata endpoints.
# Nothing reachable → O7 GO(CF) closed. Reachable → the job FAILS (alertable).
#
# G8a — this runs CONTINUOUSLY (schedule, every 6h), not only on demand. The G2
# cloud-metadata block (169.254.169.254 / metadata.google.internal) is NOT a
# HuGR-owned control: it holds only because CF does not route link-local. A CF
# routing change would silently re-open credential-theft SSRF. This job is the
# tripwire — a reachable metadata endpoint FAILS the run (fail-loud + alertable
# via GitHub's failed-workflow notifications) instead of passing silently.
name: o7-metadata-probe
on:
  workflow_dispatch: {}
  schedule:
    # Every 6 hours — continuous SSRF/IMDS reachability tripwire (G8a).
    - cron: "0 */6 * * *"
permissions:
  contents: read
jobs:
  probe:
    runs-on: corelink-dogfood
    timeout-minutes: 10
    steps:
      - name: cloud metadata reachability (assert unreachable)
        run: |
          echo "=== O7 G2 metadata probe — from INSIDE a CF runner lease ==="
          reachable=0
          for url in \
            "http://169.254.169.254/" \
            "http://169.254.169.254/latest/meta-data/" \
            "http://metadata.google.internal/" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01"; do
            echo "--- GET $url ---"
            if out=$(curl -s -m3 -w $'\nHTTP:%{http_code}' "$url" 2>&1); then
              echo "$out" | head -30
              code=$(printf '%s' "$out" | sed -n 's/.*HTTP:\([0-9][0-9]*\)$/\1/p' | tail -1)
              if [ -n "$code" ] && [ "$code" != "000" ]; then
                echo "!! REACHABLE: $url responded HTTP $code"
                reachable=1
              fi
            else
              echo "curl exit=$? (unreachable/timeout) — OK"
            fi
            echo ""
          done
          echo "=== probe done ==="
          if [ "$reachable" -ne 0 ]; then
            echo "::error title=Cloud metadata REACHABLE::A cloud metadata/IMDS endpoint responded from inside a CF runner lease — the G2 link-local block has REGRESSED. Credential-theft SSRF surface is OPEN. Mitigate at the CF network layer immediately."
            exit 1
          fi
          echo "PASS: no cloud metadata endpoint reachable from inside the lease."
