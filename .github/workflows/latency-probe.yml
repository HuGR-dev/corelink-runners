# Measure the authed hot path FROM INSIDE the fabric, where customers actually are.
#
# Every latency number CoreLink has on record was taken from the founder's laptop
# in São Paulo against ENAM-pinned tenants (`primary_region = enam`). A Cloudflare
# Worker executes at the colo nearest the CLIENT, so those numbers measure the
# GRU→ENAM distance, not the product: on 2026-08-24 the `wdb` phase read 268-287 ms
# from GRU while the same D1, read from inside the tenant's own Durable Object,
# answered in 23-50 ms. Distance, not work.
#
# This job runs on an ephemeral box on Cloudflare Containers — the same fabric a
# paying CI customer's jobs land on — so the Worker serving it runs near it. Same
# tenant, same endpoint, different vantage point. That is the control the record
# has always been missing.
#
# Credentials: measured 2026-08-25, run 32792007702 — the first dispatch of this
# workflow landed on `cf-runner-1320110b`, colo=IAD (the vantage point we wanted)
# and then failed on the credential. In prod the spawn worker is env-0, so it
# injects a single-use `CLW_CRED_TICKET`, never a raw `CLW_TOKEN`, and the trusted
# boot redeems that ticket before the job starts (a second redemption gets 410).
# A job therefore cannot authenticate to CoreLink by design. The probe carries its
# own SHORT-LIVED READ-ONLY PAT in `secrets.CORELINK_PROBE_PAT`; mint it, dispatch,
# then revoke the PAT and delete the secret. No token value is ever printed.
#
# `workflow_dispatch` only. This measures prod state, which changes without a
# commit, so it may later earn a schedule — but it starts on-demand.
name: latency-probe

on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'How many authed requests to time (default 12)'
        required: false
        type: string
        default: '12'
      tenant:
        description: 'Tenant UUID the probe PAT is scoped to'
        required: false
        type: string
        default: 'd863fafb-17c3-4ec3-92f6-b5a85c27d7bd'
      endpoint:
        description: 'CoreLink API base'
        required: false
        type: string
        default: 'https://corelink-api.humangr.com'

permissions:
  contents: read

jobs:
  probe:
    runs-on: corelink
    timeout-minutes: 10
    steps:
      - name: Vantage point
        run: |
          echo "runner : ${RUNNER_NAME:-<unset>}"
          echo "host   : $(uname -sm)"
          # Which colo is this box near? Cloudflare reports it on any zone request.
          curl -s --max-time 10 https://corelink-api.humangr.com/cdn-cgi/trace \
            | grep -E '^(colo|loc)=' || echo "trace unavailable (not fatal)"

      - name: Credential posture
        env:
          PROBE_PAT: ${{ secrets.CORELINK_PROBE_PAT }}
          PROBE_TENANT: ${{ inputs.tenant }}
        run: |
          # Presence only — every branch here handles a LIVE credential and never
          # prints one.
          #
          # Why an explicit probe PAT and not the autoscaler's injection: in prod
          # the spawn worker runs env-0, so it injects CLW_CRED_TICKET, never a raw
          # CLW_TOKEN (`deploy/cloudflare/src/lib.ts` buildContainerEnv), and that
          # ticket is SINGLE-USE — the trusted boot in `deploy/runner/entrypoint.sh`
          # redeems it before the job starts, and a second redemption gets 410 by
          # design (`handlers/cas_cred.rs`). A job therefore CANNOT authenticate to
          # CoreLink on its own. That is the security posture working, not a bug, so
          # this probe carries its own short-lived read-only PAT instead.
          if [ -n "${PROBE_PAT:-}" ] && [ -n "${PROBE_TENANT:-}" ]; then
            echo "cred=probe-pat tenant=${PROBE_TENANT} token=present"
            echo "CRED=probe" >> "$GITHUB_ENV"
          elif [ -n "${CLW_ENDPOINT:-}" ] && [ -n "${CLW_TOKEN:-}" ] && [ -n "${CLW_TENANT:-}" ]; then
            # Legacy raw-PAT injection (non-prod ALLOW_LEGACY_PAT_ENV path only).
            echo "cred=clw-token tenant=${CLW_TENANT} token=present"
            echo "CRED=clw" >> "$GITHUB_ENV"
          else
            echo "::error::No credential to measure with."
            echo "::error::ticket-present=$([ -n "${CLW_CRED_TICKET:-}" ] && echo yes || echo no) (single-use, consumed at boot — unusable here)"
            echo "::error::Set the CORELINK_PROBE_PAT secret to a short-lived read-only PAT for the tenant."
            exit 1
          fi

      - name: Time the authed hot path
        env:
          N: ${{ inputs.samples }}
          PROBE_PAT: ${{ secrets.CORELINK_PROBE_PAT }}
          PROBE_TENANT: ${{ inputs.tenant }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -uo pipefail
          if [ "${CRED}" = "probe" ]; then
            tok="${PROBE_PAT}"; tenant="${PROBE_TENANT}"; base="${ENDPOINT%/}"
          else
            tok="${CLW_TOKEN}"; tenant="${CLW_TENANT}"; base="${CLW_ENDPOINT%/}"
          fi
          url="${base}/v1/ac/${tenant}?limit=1"
          # Warm the connection and the caches first: a cold isolate or a cold
          # container skews the first samples badly and says nothing about steady
          # state. Discard these.
          for _ in 1 2 3; do
            curl -s -o /dev/null -H "Authorization: Bearer ${tok}" "$url" || true
          done
          echo "=== ${N:-12} samples, warm, connection reused"
          for _ in $(seq 1 "${N:-12}"); do
            curl -s -o /dev/null -D - -H "Authorization: Bearer ${tok}" "$url" 2>/dev/null \
              | tr -d '\r' | grep -i '^server-timing:' | cut -d' ' -f2- || true
          done

      - name: Time the read path a build tool actually hits
        env:
          PROBE_PAT: ${{ secrets.CORELINK_PROBE_PAT }}
          PROBE_TENANT: ${{ inputs.tenant }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -uo pipefail
          # The list endpoint above is the one the latency record was built on,
          # but it is not what a build tool spends its day doing: a cache client
          # LOOKS UP an action result. That is a different container path — only
          # `list` was made concurrent (#1316); `lookup` still runs the audit
          # write, the BYOK key resolution and the R2 GET strictly serially,
          # because the byok step sits between the other two. Measure it, so the
          # next optimization is aimed at what customers pay for rather than at
          # the endpoint that happened to be easy to probe.
          if [ "${CRED}" = "probe" ]; then
            tok="${PROBE_PAT}"; tenant="${PROBE_TENANT}"; base="${ENDPOINT%/}"
          else
            tok="${CLW_TOKEN}"; tenant="${CLW_TENANT}"; base="${CLW_ENDPOINT%/}"
          fi
          # Take a REAL ref from this tenant's own action cache. No fixture: if
          # the tenant has no refs, say so and stop, rather than inventing a
          # digest that would only ever measure the 404 path and report it as if
          # it were a cache hit. `grep -o` + `sed` rather than `| head` — a
          # closed pipe under `pipefail` aborts the step (B-040).
          refs="$(curl -s -H "Authorization: Bearer ${tok}" "${base}/v1/ac/${tenant}?limit=5")"
          key="$(printf '%s' "$refs" | grep -o '"ref_key":"[^"]*"' | sed -n '1s/.*:"//;1s/"$//p')"
          if [ -z "${key}" ]; then
            echo "no refs on this tenant — AC lookup NOT measured (nothing to look up)"
            exit 0
          fi
          echo "=== AC lookup: GET /v1/ac/{tenant}/{ref} — serial audit then byok then R2 GET"
          url="${base}/v1/ac/${tenant}/${key}"
          for _ in 1 2 3; do
            curl -s -o /dev/null -H "Authorization: Bearer ${tok}" "$url" || true
          done
          for _ in 1 2 3 4 5 6; do
            curl -s -o /dev/null -D - -H "Authorization: Bearer ${tok}" "$url" 2>/dev/null \
              | tr -d '\r' | grep -i '^server-timing:' | cut -d' ' -f2- || true
          done

      - name: The one number the D1-transport ADR is blocked on
        env:
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -uo pipefail
          # `docs/design/2026-08-25-adr-container-d1-transport.md` turns on ONE
          # unmeasured number: what a round trip from inside the fabric to our own
          # Worker edge costs. If that hop is ~40 ms — the order of the `ohop` we
          # already measure in the other direction — then routing the container's
          # D1 writes through a Worker endpoint saves nothing (40 + 40 against the
          # ~100 ms the public REST API costs today) and only the DO-commits-the-row
          # option is worth building. The ADR deliberately refuses to estimate it.
          #
          # `/health` is Worker-only: no DO, no container, no D1. So its wall time
          # IS the box→edge→box round trip plus the Worker's own trivial work, which
          # is the closest honest proxy for the hop a container would pay.
          base="${ENDPOINT%/}"
          for _ in 1 2 3; do curl -s -o /dev/null "${base}/health" || true; done
          echo "=== Worker-only /health, wall seconds (box -> our edge -> box)"
          for _ in 1 2 3 4 5 6 7 8; do
            curl -s -o /dev/null -w '%{http_code} total=%{time_total} connect=%{time_connect} tls=%{time_appconnect}\n' \
              "${base}/health" || true
          done
          echo "=== for contrast: the SAME box to the public CF API frontend the container uses for D1"
          # No credential: an unauthenticated 400/401 still completes the same TLS +
          # HTTP round trip to the same frontend, which is what we are timing. The
          # response body is discarded and nothing is sent that could carry a secret.
          for _ in 1 2 3; do curl -s -o /dev/null "https://api.cloudflare.com/client/v4/user/tokens/verify" || true; done
          for _ in 1 2 3 4 5 6 7 8; do
            curl -s -o /dev/null -w '%{http_code} total=%{time_total} connect=%{time_connect} tls=%{time_appconnect}\n' \
              "https://api.cloudflare.com/client/v4/user/tokens/verify" || true
          done

      - name: findMissingBlobs at the batch sizes Bazel actually sends
        env:
          PROBE_PAT: ${{ secrets.CORELINK_PROBE_PAT }}
          PROBE_TENANT: ${{ inputs.tenant }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -uo pipefail
          # The one endpoint whose cost grows with the SIZE of what the build tool
          # asks for. Measured from this same fabric on 2026-08-25, BEFORE the
          # batch seam landed: 2.10 s / 5.74 s / 13.48 s / 26.86 s at n=5/20/50/100
          # — ~268 ms per digest, dead linear, because each digest paid its own R2
          # HEAD and its own audit-row INSERT over the public D1 REST API.
          # corelink-server#1328 collapses both: one JSON1 statement per 256 audit
          # rows and 16-way concurrent existence probes. This step is what turns
          # that argued speedup into a measured one. Re-run it after every repin
          # that touches the CAS or audit path.
          #
          # Scope: read ⊇ find-missing (ADR-0071), so the read-only probe PAT is
          # enough; no write grant is minted for this.
          if [ "${CRED}" = "probe" ]; then
            tok="${PROBE_PAT}"; tenant="${PROBE_TENANT}"; base="${ENDPOINT%/}"
          else
            tok="${CLW_TOKEN}"; tenant="${CLW_TENANT}"; base="${CLW_ENDPOINT%/}"
          fi
          # <instance> IS the tenant id on this route, and the container enforces
          # caller_tenant == :instance — a mismatch measures the denial path, not
          # the batch path.
          url="${base}/bazel/v2/${tenant}/findMissingBlobs"

          # Random 64-hex digests: absent from the CAS by construction, so every
          # one of them is PROBED (present-or-absent both cost a HEAD) and the
          # response is the full list back. That is the worst case and the same
          # shape the pre-#1328 baseline above was taken with. Bodies are built
          # BEFORE timing starts so digest generation never lands in a sample.
          gen_body() {
            n="$1"; out=""
            i=0
            while [ "$i" -lt "$n" ]; do
              h="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              [ -n "$out" ] && out="${out},"
              out="${out}{\"hash\":\"${h}\",\"sizeBytes\":1024}"
              i=$((i + 1))
            done
            printf '{"blobDigests":[%s]}' "$out"
          }

          # Sizes chosen to READ THE SHAPE, not just the totals. #1328 probes
          # 16-at-a-time, so if that concurrency is real, n=1 and n=16 cost
          # about the SAME wall time and the curve steps in plateaus at 16/32/
          # 48. If instead the curve is a straight line through the origin, the
          # fan-out is not happening (or is CPU-bound on the 0.25-vCPU instance,
          # where concurrent TLS handshakes are additive rather than
          # overlapping). The first measurement after #1328 was dead linear
          # (~92 ms/digest at every size), so this is the discriminator.
          for n in 1 2 4 8 16 32 64 100; do
            body_file="$(mktemp)"
            gen_body "$n" > "$body_file"
            echo "=== n=${n} digests, 3 samples"
            for _ in 1 2 3; do
              curl -s -o /dev/null -X POST \
                -H "Authorization: Bearer ${tok}" \
                -H 'Content-Type: application/json' \
                --data-binary "@${body_file}" \
                -w "  n=${n} http=%{http_code} total=%{time_total}\n" \
                "$url" || true
            done
            rm -f "$body_file"
          done

      - name: Is the fan-out broken, or is the container the wall?
        env:
          PROBE_PAT: ${{ secrets.CORELINK_PROBE_PAT }}
          PROBE_TENANT: ${{ inputs.tenant }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          set -uo pipefail
          # The size ladder above came back a straight line — ~85 ms per digest
          # with no plateau at 16, so #1328's 16-way `buffered` fan-out is not
          # materialising. Two very different causes are still alive:
          #
          #   A. OUR fan-out is broken (the futures do not actually overlap).
          #      Then 16 SEPARATE single-digest requests, fired at once, land on
          #      the same tenant container as 16 independent tasks and finish in
          #      roughly ONE probe's time.
          #   B. the container/R2 path is the wall — CPU-bound TLS on a
          #      0.25-vCPU instance, or R2 throttling the burst and the SDK
          #      backing off. Then the 16 parallel requests cost the SAME as one
          #      16-digest request, because the ceiling is shared.
          #
          # Same tenant means the same Durable Object and therefore the same
          # container instance, which is exactly the comparison we want.
          if [ "${CRED}" = "probe" ]; then
            tok="${PROBE_PAT}"; tenant="${PROBE_TENANT}"; base="${ENDPOINT%/}"
          else
            tok="${CLW_TOKEN}"; tenant="${CLW_TENANT}"; base="${CLW_ENDPOINT%/}"
          fi
          url="${base}/bazel/v2/${tenant}/findMissingBlobs"

          one_digest_body() {
            h="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            printf '{"blobDigests":[{"hash":"%s","sizeBytes":1024}]}' "$h"
          }

          echo "=== 16 SEPARATE n=1 requests, fired concurrently"
          tmp="$(mktemp -d)"
          for i in $(seq 1 16); do one_digest_body > "${tmp}/b${i}"; done
          start="$(date +%s.%N)"
          for i in $(seq 1 16); do
            curl -s -o /dev/null -X POST \
              -H "Authorization: Bearer ${tok}" \
              -H 'Content-Type: application/json' \
              --data-binary "@${tmp}/b${i}" \
              -w "  single http=%{http_code} total=%{time_total}\n" \
              "$url" &
          done
          wait
          end="$(date +%s.%N)"
          # awk, not bc: bc is not in the runner image and a missing tool here
          # would silently print nothing where the decisive number goes.
          echo "  WALL for all 16 concurrent single-digest requests: $(awk -v a="$start" -v b="$end" 'BEGIN{printf "%.3f", b-a}')"
          rm -rf "$tmp"

          echo "=== for contrast: ONE n=16 request (same 16 digests' worth of work)"
          body="$(mktemp)"
          {
            printf '{"blobDigests":['
            for i in $(seq 1 16); do
              [ "$i" -gt 1 ] && printf ','
              printf '{"hash":"%s","sizeBytes":1024}' "$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            done
            printf ']}'
          } > "$body"
          for _ in 1 2 3; do
            curl -s -o /dev/null -X POST \
              -H "Authorization: Bearer ${tok}" \
              -H 'Content-Type: application/json' \
              --data-binary "@${body}" \
              -w "  batched-16 http=%{http_code} total=%{time_total}\n" \
              "$url" || true
          done
          rm -f "$body"

      - name: The comparison this exists to make
        run: |
          cat <<'TXT'
          Baseline from GRU (São Paulo laptop), same tenant, 2026-08-24:
            wdb 268-287 ms   qbatch 115-124 ms   ohop 160-206 ms   total 579-721 ms
          Read the `wdb` and `ohop` numbers above against those.
          If they collapse, the overhead on record was distance, not the product.
          TXT
