# Build + push the CoreLink ephemeral runner image (ADR-0007 Stage A).
#
# Runs on the self-hosted LINUX x64 builder (native — no emulation, and never the
# dev Mac), and pushes to GHCR using the built-in GITHUB_TOKEN (packages: write),
# so no personal PAT is needed. Prints the pushed image digest to pin in the
# runner-lease `image_digest` (X4 supply-chain requirement).
name: build-runner-image

on:
  # MANUAL-ONLY (2026-07-06): avoid a heavy Docker build on every Dockerfile merge.
  # Dispatch explicitly when the runner image actually needs rebuilding.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Pin to the Linux x64 builder specifically (the Mac advertises `macOS`, not
    # `Linux`, so it is excluded — a linux-x64 image must build natively).
    runs-on: [self-hosted, Linux, X64, corelink-builder]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        id: build
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/humanguardrail/corelink-runner"
          docker build \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            deploy/runner
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:latest")"
          echo "Pushed: ${DIGEST}"
          echo "image_pinned=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Summary
        run: |
          {
            echo "### CoreLink runner image pushed"
            echo ""
            echo "Pin this in the runner-lease \`image_digest\`:"
            echo ""
            echo '```'
            echo "${{ steps.build.outputs.image_pinned }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
