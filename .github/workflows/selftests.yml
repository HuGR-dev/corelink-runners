name: Script selftests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/selftests.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/selftests.yml'

permissions:
  contents: read

jobs:
  selftests:
    name: Run tracked script selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Install locked Cloudflare dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/cloudflare

      - name: Install pinned gitleaks for tracked selftests
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        shell: bash
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --retry 3 --retry-delay 1 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          printf '%s\n' "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Discover and run every tracked selftest
        shell: bash
        run: |
          set -euo pipefail
          # The glob magic makes **/ include selftests directly below scripts/
          # as well as in nested directories.
          mapfile -d '' selftests < <(git ls-files -z -- ':(glob)scripts/**/*.selftest.sh')
          if (( ${#selftests[@]} == 0 )); then
            echo 'No tracked scripts/**/*.selftest.sh files found.' >&2
            exit 1
          fi
          for selftest in "${selftests[@]}"; do
            echo "==> bash ${selftest}"
            bash "${selftest}"
          done
