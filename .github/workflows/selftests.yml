name: Script selftests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/selftests.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/selftests.yml'

permissions:
  contents: read

jobs:
  selftests:
    name: Run tracked script selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Install deploy/cloudflare deps for PAT-map selftest
        working-directory: deploy/cloudflare
        run: npm ci --ignore-scripts

      - name: Discover and run every tracked selftest
        shell: bash
        run: |
          set -euo pipefail
          # The glob magic makes **/ include selftests directly below scripts/
          # as well as in nested directories.
          mapfile -d '' selftests < <(git ls-files -z -- ':(glob)scripts/**/*.selftest.sh')
          if (( ${#selftests[@]} == 0 )); then
            echo 'No tracked scripts/**/*.selftest.sh files found.' >&2
            exit 1
          fi
          for selftest in "${selftests[@]}"; do
            echo "==> bash ${selftest}"
            bash "${selftest}"
          done
