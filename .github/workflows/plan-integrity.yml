name: Plan integrity

on:
  pull_request:
    paths:
      - 'docs/plan/*.md'
      - 'docs/plan/*.py'
      - 'docs/plan/**/*.py'
      - 'docs/plan/*finding-ids.txt'
      - 'docs/plan/evidence/**'
      - 'docs/plan/*.json'
      - 'docs/plan/**/*.json'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'
  push:
    branches: [main]
    paths:
      - 'docs/plan/*.md'
      - 'docs/plan/*.py'
      - 'docs/plan/**/*.py'
      - 'docs/plan/*finding-ids.txt'
      - 'docs/plan/evidence/**'
      - 'docs/plan/*.json'
      - 'docs/plan/**/*.json'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/actionlint.yaml'
      - '.github/actionlint.yml'

permissions:
  contents: read

# A newer revision supersedes an older run for the same PR or branch.
concurrency:
  group: plan-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Coverage, WP, and AU structure
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Lint workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          expected_actionlint_version='1.7.12'
          actual_actionlint_version="$(actionlint -version 2>&1 | sed -n '1p')"
          if [[ "$actual_actionlint_version" != "$expected_actionlint_version" ]]; then
            echo "actionlint: expected pinned version $expected_actionlint_version, got $actual_actionlint_version" >&2
            exit 1
          fi

          # Parse whichever optional config is present, but never use it for
          # the authoritative repository lint below.  In particular, an
          # ignore-all config must not be able to turn a malformed workflow or
          # a new private runner label into a false PASS.
          config_files=()
          for candidate in .github/actionlint.yaml .github/actionlint.yml; do
            if [[ -f "$candidate" ]]; then
              config_files+=("$candidate")
            fi
          done
          if [[ "${#config_files[@]}" -gt 1 ]]; then
            echo 'actionlint: keep only one of .github/actionlint.yaml or .github/actionlint.yml' >&2
            exit 1
          fi
          if [[ "${#config_files[@]}" -eq 1 ]]; then
            config_report="$(mktemp)"
            set +e
            printf '%s\n' \
              'name: actionlint-config-validation' \
              'on: push' \
              'jobs:' \
              '  check:' \
              '    runs-on: ubuntu-latest' \
              '    steps:' \
              '      - run: true' \
              | actionlint -config-file "${config_files[0]}" -stdin-filename .github/workflows/plan-integrity.yml -oneline - >"$config_report" 2>&1
            config_status=$?
            set -e
            if [[ "$config_status" -ne 0 ]]; then
              cat "$config_report"
              echo "actionlint: invalid configuration ${config_files[0]}" >&2
              exit 1
            fi
            echo "actionlint: parsed optional configuration ${config_files[0]} (non-authoritative)"
          fi

          report="$(mktemp)"
          set +e
          # /dev/null is deliberate: repository actionlint config is validated
          # above but cannot suppress this independent structural check.
          actionlint -config-file /dev/null -oneline >"$report" 2>&1
          status=$?
          set -e

          # The fleet deliberately uses private self-hosted labels.  The
          # repository has always emitted actionlint's runner-label warning
          # for these exact labels in these existing workflow files.  Keep
          # that known baseline visible, but fail on every other diagnostic
          # (including a new custom label or any warning on a new path).
          baseline='^\.github/workflows/(build-cf-container-images|build-fabricd-image|canary-smoke|ci|clw-ticket-propagation-check|corelink-smoke|corelink-stress|dco|deploy-spawn-worker|dogfood-smoke|latency-probe|moat-action-test|moat-benchmark|moat-correctness|o7-metadata-probe|orphan-box-detect|plan-integrity|prove-baked-buildkit|release|spawn-worker-ci)\.yml:[0-9]+:[0-9]+: label "(corelink|corelink-builder|corelink-dogfood)" is unknown\. available labels are .* \[runner-label\]$'
          if [[ "$status" -ne 0 && -z "$(tr -d '[:space:]' <"$report")" ]]; then
            echo "actionlint: exited nonzero without a diagnostic" >&2
            exit 1
          fi
          known="$(grep -E "$baseline" "$report" || true)"
          unexpected="$(grep -Ev "$baseline" "$report" || true)"
          if [[ -n "$known" ]]; then
            echo "actionlint: repository-baseline custom runner-label diagnostics:"
            printf '%s\n' "$known"
          fi
          if [[ -n "$unexpected" ]]; then
            cat "$report"
            echo "actionlint: unexpected diagnostics above (runner-label baseline is narrowly allowlisted)" >&2
            exit 1
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "actionlint: no diagnostics beyond the repository baseline"
          fi

      - name: Check audit finding coverage
        run: python3 docs/plan/plan-check.py docs/plan/audit-2026-08-30-finding-ids.txt

      - name: Check acceptance/WP ownership
        run: python3 docs/plan/wp-check.py docs/plan/2026-08-30-golive-remediation-plan.md

      - name: Check proposed AU ownership
        run: >-
          python3 docs/plan/au-check.py docs/plan/union-triage-remaining.md
          --plan docs/plan/2026-08-30-golive-remediation-plan.md
          --dag docs/plan/2026-09-01-reconciled-dispatch-dag.md

      - name: Exercise structural planning gates
        run: python3 docs/plan/gates-selftest.py
