# spawn-Worker PR gate — the suite that covers the fleet's placement logic.
#
# WHY THIS EXISTS: until 2026-08-03 the spawn-Worker's 351-test vitest suite ran
# ONLY inside `deploy-spawn-worker.yml`, which is `workflow_dispatch`-only. So
# every TypeScript change to the Worker that places customer jobs merged with its
# tests never having run — `ci.yml` is Rust-only plus one `node --test`, and a PR
# touching `deploy/cloudflare/**` showed two green checks (`dco`, `gates`) that do
# not execute a single line of this code.
#
# That was found while reviewing PR #444 (burst jobs left permanently queued): the
# PR was CLEAN and green, and the only evidence its fix worked was a suite the
# author ran on a laptop. A gate that is green because it never looked is the
# failure mode this repo family has been hunting all week.
#
# The deploy workflow keeps its own `test` job — that gate is about not shipping a
# red build, and it stays. This one is about not MERGING an untested one.
name: spawn-worker CI

on:
  pull_request:
    paths:
      - 'deploy/cloudflare/**'
      # The Worker-side conformance tests read shared vectors from the repo
      # root; rerun them when a vector changes even if the Worker source does
      # not.
      - 'conformance/**'
      - '.github/workflows/spawn-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare/**'
      - 'conformance/**'
      - '.github/workflows/spawn-worker-ci.yml'

permissions:
  contents: read

# A force-push should not leave an obsolete run burning minutes.
concurrency:
  group: spawn-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: spawn-Worker typecheck + vitest
    # Secretless Node typecheck/tests on a standard GitHub-hosted Linux VM.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `vitest run` exits non-zero on any failure. Deliberately NOT
      # `continue-on-error` and deliberately NOT filtered to changed files: the
      # placement logic is one state machine and a change anywhere in it can
      # strand a customer's job somewhere else.
      - name: Test (vitest) + coverage floor
        # `test:coverage` is `vitest run --coverage`. The `--coverage` half is
        # LOAD-BEARING: vitest evaluates the `coverage.thresholds` block in
        # vitest.config.ts ONLY when the provider is enabled, so reverting this
        # to `npm run test` would disarm the floor without failing anything.
        # Exit code is vitest's own (no pipe, no `|| true`).
        run: npm run test:coverage

      # A suite that silently stops collecting tests would pass vacuously — the
      # exact shape this workflow exists to prevent. Assert the count is in the
      # expected band instead of trusting the green.
      - name: Assert the suite actually ran
        run: |
          set -euo pipefail
          count="$(npx vitest run --reporter=json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const j=JSON.parse(s.slice(s.indexOf("{")));
                console.log(j.numTotalTests ?? 0);
              })')"
          echo "tests collected: ${count}"
          if [ "${count}" -lt 300 ]; then
            echo "::error ::spawn-Worker suite collected only ${count} tests (expected >=300)." \
                 "A suite that stops collecting passes vacuously; that is the failure this gate exists to catch."
            exit 1
          fi

  issue-605-cross-repo:
    name: issue #605 Rust ingest + TypeScript flusher
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'Closes') && contains(github.event.pull_request.body, '605') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact runners PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Check out pinned server fixture SHA
        id: server_checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: HuGR-dev/corelink-server
          ref: 64db73fb4fd60fb80ab44cdf5bd487121148d8e2
          path: server
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/deploy/cloudflare/package-lock.json

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.91.1

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Cache Cargo
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: 'server -> server/target'
          shared-key: issue-605-cross-repo

      - name: Build exact Rust ingest fixture
        env:
          SERVER_EXPECTED_SHA: 64db73fb4fd60fb80ab44cdf5bd487121148d8e2
        run: |
          set -euo pipefail
          server_sha="$(git -C server rev-parse HEAD)"
          test "$server_sha" = "$SERVER_EXPECTED_SHA"
          cargo build --locked --manifest-path server/crates/corelink-container/Cargo.toml \
            --bin issue-605-billing-ingest-fixture

      - name: Install runner Worker dependencies
        working-directory: candidate/deploy/cloudflare
        run: npm ci

      - name: Run real Rust-to-TypeScript recovery integration
        working-directory: candidate/deploy/cloudflare
        env:
          CORELINK_SERVER_BIN: ${{ github.workspace }}/server/target/debug/issue-605-billing-ingest-fixture
          CORELINK_SERVER_SHA: ${{ steps.server_checkout.outputs.commit }}
          CORELINK_RUNNERS_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          tested_runners_sha="$(git -C "$GITHUB_WORKSPACE/candidate" rev-parse HEAD)"
          tested_server_sha="$(git -C "$GITHUB_WORKSPACE/server" rev-parse HEAD)"
          test "$tested_runners_sha" = "$CORELINK_RUNNERS_SHA"
          test "$tested_server_sha" = "$CORELINK_SERVER_SHA"
          echo "CORELINK_TESTED_RUNNERS_SHA=$tested_runners_sha" >> "$GITHUB_ENV"
          npx vitest run test/issue-605-billing-integration.test.ts

      - name: Write exact-SHA cross-repo receipt
        env:
          SERVER_SHA: ${{ steps.server_checkout.outputs.commit }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RECEIPT_PATH: ${{ runner.temp }}/issue-605-cross-repo-receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "issue": 605,
              "runner_repository": "HuGR-dev/corelink-runners",
              "runner_pr_number": int(os.environ["PR_NUMBER"]),
              "runner_sha": os.environ["CORELINK_TESTED_RUNNERS_SHA"],
              "server_repository": "HuGR-dev/corelink-server",
              "server_sha": os.environ["SERVER_SHA"],
              "result": "PASS",
              "scenarios": [
                  "mixed accepted/deduped/rejected/conflict",
                  "worker restart and retry after lost acknowledgement",
                  "settlement write failure and retry",
                  "quarantine write failure and retry",
                  "ambiguous acknowledgement retains source",
                  "server persistence failure is retryable",
              ],
              "provider_credentials_used": False,
              "run_url": os.environ["RUN_URL"],
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY

      - name: Upload cross-repo receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-605-cross-repo-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-605-cross-repo-receipt.json
          if-no-files-found: ignore
          retention-days: 30
