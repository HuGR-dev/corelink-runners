[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
# Error handling — exact-pinned (transplanted runner core; scout dep budget)
anyhow     = "=1.0.102"
# Serialization — exact-pinned matching hugit-contracts (wire-contract conformance)
serde      = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
# JSON Schema — exact-pinned matching hugit-contracts (schemars 1.x)
schemars   = { version = "=1.2.1", features = ["derive"] }
# Cryptography — exact-pinned matching hugit (WP-R4: fence materialize's
# content digests, the X4 supply-chain pin convention)
sha2       = "=0.10.9"
# Attestation signing — exact-pinned (WP-ATT1a; ratified decision #2:
# ed25519, fabric key; base64 = standard alphabet for sig/pubkey wire form)
base64        = "=0.22.1"
ed25519-dalek = "=2.2.0"
# HTTP server stack — exact-pinned, MINIMAL feature sets (WP-API1; house
# stack: corelink-server runs axum 0.7 minimal — mirrored, not forked).
# tower is dev-only today (ServiceExt::oneshot in acceptance tests).
axum  = { version = "=0.7.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
# Outbound HTTP client — exact-pinned (WP-CLOUD1: the CloudSandboxEngine's
# Northflank adapter). Sync/blocking by design (no tokio contagion into the sync
# `Engine` seam); quarantined behind the crate's `HttpTransport` trait — ureq is
# named in exactly one impl (`UreqTransport`), never in the engine logic or tests.
ureq = "=3.3.0"
# Persistent lease ledger — exact-pinned (WP-3-PGLEDGER: the production
# cross-instance cap-safe `PgLedger`). Owner-ratified dep adoption; recon
# confirmed MIT/Apache, no duplicate-version collision, `rsa` not reachable.
# The sync `LeaseLedger` trait stays sync — `PgLedger` bridges via
# block_in_place on the server's rt-multi-thread runtime (never made async).
tokio-postgres    = "=0.7.18"
deadpool-postgres = "=0.14.1"
deadpool-runtime  = "=0.3.1"
postgres-types    = "=0.2.14"
postgres-protocol = "=0.6.12"
