[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
# Serialization — exact-pinned matching hugit-contracts (wire-contract conformance)
serde      = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
# JSON Schema — exact-pinned matching hugit-contracts (schemars 1.x)
schemars   = { version = "=1.2.1", features = ["derive"] }
