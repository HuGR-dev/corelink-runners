name: CoreLink Run
description: >
  Run a memoized, attested job on the CoreLink fabric.
  Boot is cache-warm; a re-run whose result is already memoized returns in
  milliseconds. Fails closed if the attestation does not verify.

# ---------------------------------------------------------------------------
# BINARY AVAILABILITY NOTE
# ---------------------------------------------------------------------------
# The `corelink` binary is not yet published to crates.io and has no public
# release URL.  Until a release exists, this action expects the binary to be
# on PATH — built and cached in an earlier step of your workflow.
#
# When a release is published the "install" step below will download and cache
# the binary automatically using the `version` input.  The placeholder URL
# pattern is:
#
#   https://github.com/HuGR-Labs/corelink-runners/releases/download/v<version>/corelink-<os>-<arch>
#
# Until then, add a build step before this action:
#
#   - name: Build corelink CLI
#     run: cargo build -p corelink-cli --release && echo "$PWD/target/release" >> $GITHUB_PATH
#
# or cache a previously built binary and add it to PATH yourself.
# ---------------------------------------------------------------------------

inputs:
  url:
    description: >
      CoreLink fabric base URL (e.g. https://runners.corelink.dev).
      Overrides the CORELINK_URL environment variable.
    required: true

  pat:
    description: >
      CoreLink Personal Access Token — must be a repository secret.
      Consumed as the CORELINK_PAT env var (Bearer); never echoed or logged.
    required: true

  check:
    description: Shell command to run on the fabric (passed verbatim to --check).
    required: true

  check-id:
    description: Stable identifier for this check (used in memoization and attestation).
    required: false
    default: "ci"

  image:
    description: >
      Container image reference, MUST include a sha256 digest
      (e.g. ubuntu@sha256:abc123…).  The fabric rejects unpinned images
      (X4 supply-chain floor), so this is enforced before a box is contacted.
    required: false
    default: ""

  verify:
    description: >
      Verify the fabric attestation after the run.  Set to "false" only for
      local / dev use where the fabric runs with FABRIC_DEV_UNSAFE=1.
      A verification failure is always a hard step failure.
    required: false
    default: "true"

  version:
    description: >
      corelink CLI release version to install (e.g. "0.1.0").
      Currently unused — the action falls back to the binary on PATH.
      Will activate when a release artifact URL is published.
    required: false
    default: "0.1.0"

outputs:
  exit:
    description: Exit code returned by the check command on the fabric.
    value: ${{ steps.parse.outputs.exit }}

  verified:
    description: '"true" if the fabric attestation was cryptographically verified, "false" otherwise.'
    value: ${{ steps.parse.outputs.verified }}

  lease-id:
    description: The CoreLink lease ID for this run (useful for audit / support).
    value: ${{ steps.parse.outputs.lease_id }}

runs:
  using: composite
  steps:
    # -----------------------------------------------------------------------
    # Step 1 — locate (or install) the corelink binary
    # -----------------------------------------------------------------------
    - name: Locate corelink binary
      id: locate
      shell: bash
      env:
        # version input is captured here for future use in artifact download.
        # When a release exists this step will download:
        #   https://github.com/HuGR-Labs/corelink-runners/releases/download/v<version>/corelink-<os>-<arch>
        CORELINK_VERSION: ${{ inputs.version }}
      run: |
        if command -v corelink &>/dev/null; then
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "corelink binary found at: $(command -v corelink) (version input: ${CORELINK_VERSION})"
        else
          echo "::error::corelink binary not found on PATH."
          echo ""
          echo "Until a public release exists (version ${CORELINK_VERSION} requested),"
          echo "build and cache the binary in an earlier workflow step:"
          echo ""
          echo "  - name: Build corelink CLI"
          echo "    run: cargo build -p corelink-cli --release && echo \"\$PWD/target/release\" >> \$GITHUB_PATH"
          echo ""
          echo "See integrations/github-actions/README.md for details."
          exit 1
        fi

    # -----------------------------------------------------------------------
    # Step 2 — run the job on the fabric
    # -----------------------------------------------------------------------
    - name: Run on CoreLink fabric
      id: run
      shell: bash
      env:
        # PAT is injected into the environment; the variable is never printed.
        CORELINK_PAT: ${{ inputs.pat }}
        CORELINK_URL: ${{ inputs.url }}
        CORELINK_CHECK: ${{ inputs.check }}
        CORELINK_CHECK_ID: ${{ inputs.check-id }}
        CORELINK_IMAGE: ${{ inputs.image }}
        CORELINK_VERIFY: ${{ inputs.verify }}
      run: |
        # Build the argument list incrementally so we never interpolate the
        # PAT into a string that might be echoed.
        ARGS=()
        ARGS+=(run)
        ARGS+=(--url "$CORELINK_URL")
        ARGS+=(--check "$CORELINK_CHECK")
        ARGS+=(--check-id "$CORELINK_CHECK_ID")
        ARGS+=(--json)

        if [[ -n "$CORELINK_IMAGE" ]]; then
          ARGS+=(--image "$CORELINK_IMAGE")
        fi

        if [[ "$CORELINK_VERIFY" == "false" ]]; then
          ARGS+=(--no-verify)
        fi

        # Run and capture JSON stdout; steps/diagnostics go to stderr.
        # We capture the exit code manually so we can handle exit-1
        # (check ran but failed) separately from exit-2 (wire/auth/attest error).
        CORELINK_TMP_DIR=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/corelink.XXXXXX")
        CORELINK_STDERR_FILE="$CORELINK_TMP_DIR/stderr"
        CORELINK_OUTPUT_FILE="$CORELINK_TMP_DIR/output.json"
        set +e
        JSON_OUT=$(corelink "${ARGS[@]}" 2>"$CORELINK_STDERR_FILE")
        RAW_EXIT=$?
        set -e

        # Always surface stderr so the runner log shows fabric diagnostics.
        if [[ -s "$CORELINK_STDERR_FILE" ]]; then
          cat "$CORELINK_STDERR_FILE" >&2
        fi

        # exit 2 = attestation failed / wire / auth error → always hard fail.
        if [[ $RAW_EXIT -eq 2 ]]; then
          echo "::error::corelink exited with code 2 — attestation failed, wire error, auth error, or unpinned image. Do NOT trust this result."
          exit 2
        fi

        # Persist the raw JSON and the fabric exit code for the next step.
        echo "$JSON_OUT" > "$CORELINK_OUTPUT_FILE"
        echo "raw_exit=$RAW_EXIT" >> "$GITHUB_OUTPUT"
        echo "output_file=$CORELINK_OUTPUT_FILE" >> "$GITHUB_OUTPUT"

    # -----------------------------------------------------------------------
    # Step 3 — parse JSON and set action outputs
    # -----------------------------------------------------------------------
    - name: Parse output and set outputs
      id: parse
      shell: python3 {0}
      env:
        CORELINK_VERIFY: ${{ inputs.verify }}
        CORELINK_OUTPUT_FILE: ${{ steps.run.outputs.output_file }}
      run: |
        import json
        import os
        import sys

        output_file = os.environ.get("GITHUB_OUTPUT", "")

        try:
            with open(os.environ["CORELINK_OUTPUT_FILE"]) as f:
                data = json.load(f)
        except (FileNotFoundError, json.JSONDecodeError) as e:
            print(f"::error::Failed to parse corelink JSON output: {e}", file=sys.stderr)
            sys.exit(2)

        lease_id = data.get("lease_id", "")
        exit_code = str(data.get("exit", ""))
        verified = str(data.get("verified", "false")).lower()

        # A false verified with verify=true is a hard failure.
        verify_input = os.environ.get("CORELINK_VERIFY", "true")
        if verify_input != "false" and verified != "true":
            print(
                "::error::CoreLink attestation NOT verified (verified=false in fabric response). "
                "Do NOT trust this result. Set verify=false only for local dev with FABRIC_DEV_UNSAFE=1.",
                file=sys.stderr,
            )
            sys.exit(2)

        if output_file:
            with open(output_file, "a") as f:
                f.write(f"exit={exit_code}\n")
                f.write(f"verified={verified}\n")
                f.write(f"lease_id={lease_id}\n")
        else:
            # Fallback for local testing
            print(f"exit={exit_code}")
            print(f"verified={verified}")
            print(f"lease_id={lease_id}")

    # -----------------------------------------------------------------------
    # Step 4 — propagate check exit code as step status
    # -----------------------------------------------------------------------
    - name: Propagate check exit
      id: propagate
      shell: bash
      env:
        RAW_EXIT: ${{ steps.run.outputs.raw_exit }}
      run: |
        # exit 0 = ran + verified + check passed
        # exit 1 = ran + verified but check itself failed (job failure)
        if [[ "$RAW_EXIT" -ne 0 ]]; then
          echo "::error::The check command exited with code $RAW_EXIT on the CoreLink fabric."
          exit "$RAW_EXIT"
        fi
