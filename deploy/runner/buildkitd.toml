# F3.2 WP-R — route docker.io base-image pulls through the CoreLink OCI cache.
#
# buildkitd reads this (docker-shim.sh spawns `buildkitd --config
# /etc/buildkit/buildkitd.toml`). It makes a `FROM alpine` / `FROM node:20` in a
# customer `docker build` resolve its LAYER BLOBS through CoreLink's OCI registry
# (corelink-api.humangr.com, the /v2/ + /token HMAC-bearer surface, routes/oci.rs)
# instead of pulling straight from Docker Hub. Allowlisted public base layers are
# served once from the shared cross-tenant `_public` namespace (the F3.2 moat);
# everything else transparently falls through.
#
# ⚠️ FAIL-OPEN IS LOAD-BEARING. WP-G (fetch-from-upstream-on-miss) is not built,
# so CoreLink only serves layer digests that were pre-mirrored into `_public`.
# For every other digest the mirror is a MISS and buildkit MUST fall back to
# docker.io — a customer build must NEVER break because the cache lacked a layer.
# BuildKit falls through to the canonical registry when a mirror returns 404 (and,
# for our purposes, when the mirror is unauthenticated/unreachable); this is
# verified by use on a real lease before the fleet is repinned (see the WP-R PR).

[registry."docker.io"]
  mirrors = ["corelink-api.humangr.com"]

[registry."corelink-api.humangr.com"]
  # Public prod endpoint: real HTTPS cert, authenticated (/token two-leg). NOT
  # insecure/http — leave both false so buildkit uses TLS and the bearer flow.
  http = false
  insecure = false
