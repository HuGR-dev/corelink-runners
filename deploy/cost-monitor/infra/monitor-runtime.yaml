AWSTemplateFormatVersion: '2010-09-09'
Description: CoreLink monitor runtime; deploy after monitor foundation and immutable image scan.
Parameters:
  ResourcePrefix: {Type: String, Default: corelink-monitor, AllowedPattern: '^[a-z0-9-]{1,32}$'}
  ImageUri:
    Type: String
    Description: ECR image URI with immutable sha256 digest; tags are rejected.
    AllowedPattern: '^([0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/)[a-z0-9/_-]+@sha256:[0-9a-f]{64}$'
  FoundationTableName: {Type: String}
  FoundationBucketArn: {Type: String, AllowedPattern: '^arn:[^:]+:s3:::[a-z0-9.-]+$'}
  FoundationTopicArn: {Type: String, AllowedPattern: '^arn:[^:]+:sns:[^:]+:975306274105:.+$'}
  RuntimeRoleArn: {Type: String, AllowedPattern: '^arn:[^:]+:iam::975306274105:role/.+$'}
  SchedulerRoleArn: {Type: String, AllowedPattern: '^arn:[^:]+:iam::975306274105:role/.+$'}
  JournalKeyArn: {Type: String, AllowedPattern: '^arn:[^:]+:kms:[^:]+:975306274105:key/.+$'}
  SigningKeyArn: {Type: String, AllowedPattern: '^arn:[^:]+:kms:[^:]+:975306274105:key/.+$'}
  SensitivitySchedulerRoleArn: {Type: String, AllowedPattern: '^arn:[^:]+:iam::286590629898:role/.+$'}
  SchedulerDeadLetterQueueArn: {Type: String, AllowedPattern: '^arn:[^:]+:sqs:[^:]+:975306274105:.+$'}
  MonitorConfigJson:
    Type: String
    NoEcho: true
    MinLength: 2
    Description: Exact validated MONITOR_CONFIG_JSON; no runtime defaults are permitted.
  AuditLogId: {Type: String, AllowedPattern: '^[A-Za-z0-9._:/-]{1,256}$'}
  OnCallAccountIds:
    Type: CommaDelimitedList
    Description: IAM account IDs permitted to acknowledge a page.
  PageAckMaxSkewMs: {Type: Number, MinValue: 1}
  PageAckTtlMs: {Type: Number, MinValue: 1}
Resources:
  MonitorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}'
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Role: !Ref RuntimeRoleArn
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          MONITOR_CONFIG_JSON: !Ref MonitorConfigJson
          MONITOR_AUDIT_LOG_ID: !Ref AuditLogId
          MONITOR_API_ID: !Ref HttpApi
          MONITOR_API_STAGE: '$default'
          MONITOR_ONCALL_ACCOUNT_IDS: !Join [',', !Ref OnCallAccountIds]
          MONITOR_PAGE_ACK_MAX_SKEW_MS: !Ref PageAckMaxSkewMs
          MONITOR_PAGE_ACK_TTL_MS: !Ref PageAckTtlMs
          STATE_TABLE: !Ref FoundationTableName
          JOURNAL_BUCKET_ARN: !Ref FoundationBucketArn
          RECEIPT_TOPIC_ARN: !Ref FoundationTopicArn
          JOURNAL_KEY_ARN: !Ref JournalKeyArn
          SIGNING_KEY_ARN: !Ref SigningKeyArn
          HMAC_AUTH_MODE: application
  PublishedVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref MonitorFunction
      Description: !Sub 'Immutable monitor image ${ImageUri}'
  LiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref MonitorFunction
      FunctionVersion: !GetAtt PublishedVersion.Version
      Name: live
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ResourcePrefix}-https'
      ProtocolType: HTTP
  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref LiveAlias
      PayloadFormatVersion: '2.0'
  HttpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /{proxy+}'
      Target: !Sub integrations/${HttpIntegration}
  PageAckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /v1/incidents/{incidentId}/pages/{pageId}/ack'
      AuthorizationType: AWS_IAM
      Target: !Sub integrations/${HttpIntegration}
  HttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
  HttpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LiveAlias
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'
  SensitivityInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PublishedVersion
      Principal: !Ref SensitivitySchedulerRoleArn
  MonitorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ResourcePrefix}-tick-60s'
      Description: Monitor tick; application validates authenticated input and state transitions.
      FlexibleTimeWindow: {Mode: OFF}
      ScheduleExpression: rate(60 seconds)
      State: ENABLED
      Target:
        Arn: !Ref LiveAlias
        RoleArn: !Ref SchedulerRoleArn
        DeadLetterConfig: {Arn: !Ref SchedulerDeadLetterQueueArn}
        Input: '{"kind":"monitor_tick","source":"aws-scheduler"}'
        RetryPolicy: {MaximumEventAgeInSeconds: 60, MaximumRetryAttempts: 2}
Outputs:
  FunctionArn: {Value: !GetAtt MonitorFunction.Arn}
  PublishedVersion: {Value: !GetAtt PublishedVersion.Version}
  LiveAliasArn: {Value: !Ref LiveAlias}
  ApiEndpoint: {Value: !GetAtt HttpApi.ApiEndpoint}
  ScheduleArn: {Value: !GetAtt MonitorSchedule.Arn}
