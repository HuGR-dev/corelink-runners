AWSTemplateFormatVersion: '2010-09-09'
Description: CoreLink monitor foundation; deploy only in account 975306274105.
Parameters:
  ResourcePrefix:
    Type: String
    Default: corelink-monitor
    AllowedPattern: '^[a-z0-9-]{1,32}$'
  WitnessFunctionArn:
    Type: String
    AllowedPattern: '^arn:[^:]+:lambda:[^:]+:888348805607:function:[A-Za-z0-9_-]+:[0-9]+$'
    Description: Qualified verifier witness Lambda ARN; the runtime may invoke only this function.
  SourceSecretArns:
    Type: CommaDelimitedList
    Description: Exact versioned monitor source-secret ARNs allowed to the runtime.
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ResourcePrefix}-state'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS}
      DeletionProtectionEnabled: true
      Tags: [{Key: CoreLink, Value: monitor}, {Key: HuGR, Value: monitor}]
  JournalKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink monitor journal encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  SigningKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink monitor signing witness
      KeySpec: RSA_3072
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  IngestKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink monitor ingest receipt signer
      KeySpec: RSA_3072
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: true
      KeyPolicy: {Version: '2012-10-17', Statement: [{Sid: AccountAdministration, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}, Action: 'kms:*', Resource: '*'}]}
  AckKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink monitor ACK signer
      KeySpec: RSA_3072
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: true
      KeyPolicy: {Version: '2012-10-17', Statement: [{Sid: AccountAdministration, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}, Action: 'kms:*', Resource: '*'}]}
  RecoveryKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink monitor recovery signer
      KeySpec: RSA_3072
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: true
      KeyPolicy: {Version: '2012-10-17', Statement: [{Sid: AccountAdministration, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}, Action: 'kms:*', Resource: '*'}]}
  PageAckKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink monitor page ACK signer
      KeySpec: RSA_3072
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: true
      KeyPolicy: {Version: '2012-10-17', Statement: [{Sid: AccountAdministration, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}, Action: 'kms:*', Resource: '*'}]}
  JournalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: aws:kms, KMSMasterKeyID: !GetAtt JournalKey.Arn}
      BucketKeyEnabled: true
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      VersioningConfiguration: {Status: Enabled}
      ObjectLockEnabled: Enabled
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule: {DefaultRetention: {Mode: COMPLIANCE, Days: 8}}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
  JournalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref JournalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt JournalBucket.Arn, !Sub '${JournalBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: 'false'}}
  SchedulerDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ResourcePrefix}-scheduler-dlq'
      SqsManagedSseEnabled: true
  ReceiptTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ResourcePrefix}-receipts'
      KmsMasterKeyId: alias/aws/sns
  RuntimeRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ResourcePrefix}/runtime'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      EmptyOnDelete: false
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-runtime'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: exact-monitor-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:TransactWriteItems]
                Resource: !GetAtt StateTable.Arn
              - {Effect: Allow, Action: sns:Publish, Resource: !Ref ReceiptTopic}
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectRetention, s3:PutObjectRetention]
                Resource: !Sub '${JournalBucket.Arn}/journal/*'
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource: !GetAtt JournalBucket.Arn
                Condition: {StringLike: {s3:prefix: ['journal/*']}}
              # The runtime can sign only with the three distinct monitor
              # authorities it binds from MONITOR_CONFIG_JSON.  It has no
              # wildcard KMS authority and cannot manage or decrypt keys.
              - Effect: Allow
                Action: [kms:Sign, kms:GetPublicKey]
                Resource: [!GetAtt SigningKey.Arn, !GetAtt IngestKey.Arn, !GetAtt AckKey.Arn, !GetAtt RecoveryKey.Arn, !GetAtt PageAckKey.Arn]
              - {Effect: Allow, Action: lambda:InvokeFunction, Resource: !Ref WitnessFunctionArn}
              - {Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref SourceSecretArns}
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: '*'}
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-scheduler'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: scheduler.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: invoke-monitor-alias
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ResourcePrefix}:live'
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-ingest'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: sign-ingest, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !GetAtt IngestKey.Arn}]}}]
  AckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-ack'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: sign-ack, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !GetAtt AckKey.Arn}]}}]
  RecoveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-recovery'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: sign-recovery, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !GetAtt RecoveryKey.Arn}]}}]
  ManifestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-manifest'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: sign-manifest, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !GetAtt SigningKey.Arn}]}}]
  PageAckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-page-ack'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: sign-page-ack, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !GetAtt PageAckKey.Arn}]}}]
  JournalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-journal'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      Policies: [{PolicyName: encrypt-journal, PolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey], Resource: !GetAtt JournalKey.Arn}]}}]
Outputs:
  StateTableName: {Value: !Ref StateTable}
  StateTableArn: {Value: !GetAtt StateTable.Arn}
  JournalBucketName: {Value: !Ref JournalBucket}
  JournalBucketArn: {Value: !GetAtt JournalBucket.Arn}
  JournalKeyArn: {Value: !GetAtt JournalKey.Arn}
  SigningKeyArn: {Value: !GetAtt SigningKey.Arn}
  IngestKeyArn: {Value: !GetAtt IngestKey.Arn}
  AckKeyArn: {Value: !GetAtt AckKey.Arn}
  RecoveryKeyArn: {Value: !GetAtt RecoveryKey.Arn}
  PageAckKeyArn: {Value: !GetAtt PageAckKey.Arn}
  IngestRoleArn: {Value: !GetAtt IngestRole.Arn}
  AckRoleArn: {Value: !GetAtt AckRole.Arn}
  RecoveryRoleArn: {Value: !GetAtt RecoveryRole.Arn}
  ManifestRoleArn: {Value: !GetAtt ManifestRole.Arn}
  PageAckRoleArn: {Value: !GetAtt PageAckRole.Arn}
  JournalRoleArn: {Value: !GetAtt JournalRole.Arn}
  ReceiptTopicArn: {Value: !Ref ReceiptTopic}
  RuntimeRepositoryUri: {Value: !GetAtt RuntimeRepository.RepositoryUri}
  RuntimeRoleArn: {Value: !GetAtt RuntimeRole.Arn}
  SchedulerRoleArn: {Value: !GetAtt SchedulerRole.Arn}
  SchedulerDeadLetterQueueArn: {Value: !GetAtt SchedulerDeadLetterQueue.Arn}
