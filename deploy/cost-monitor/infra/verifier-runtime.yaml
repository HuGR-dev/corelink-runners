AWSTemplateFormatVersion: '2010-09-09'
Description: CoreLink verifier witness runtime; deploy in account 888348805607 after verifier foundation.
Parameters:
  ResourcePrefix: {Type: String, Default: corelink-verifier, AllowedPattern: '^[a-z0-9-]{1,32}$'}
  ImageUri:
    Type: String
    Description: ECR image URI with an immutable sha256 digest; tags and latest are rejected.
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9/_-]+@sha256:[0-9a-f]{64}$'
  VerificationHeadTableArn: {Type: String, AllowedPattern: '^arn:aws:dynamodb:[a-z0-9-]+:888348805607:table/[A-Za-z0-9_.-]+$'}
  JournalBucketArn: {Type: String, AllowedPattern: '^arn:aws:s3:::[a-z0-9.-]+$'}
  JournalPrefix: {Type: String, Default: journal/, AllowedPattern: '^[a-zA-Z0-9!_.*\-/]{1,128}$'}
  WitnessKeyArn: {Type: String, AllowedPattern: '^arn:aws:kms:[a-z0-9-]+:888348805607:key/[0-9a-f-]+$'}
  VerifierRoleArn: {Type: String, AllowedPattern: '^arn:aws:iam::888348805607:role/[A-Za-z0-9+=,.@_-]+$'}
  MonitorInvokerRoleArn: {Type: String, AllowedPattern: '^arn:aws:iam::975306274105:role/[A-Za-z0-9+=,.@_-]+$'}
  WitnessConfigJson:
    Type: String
    NoEcho: true
    Description: Exact version-bound WITNESS_CONFIG_JSON; never place secrets in this value.
    MinLength: 2
Resources:
  RuntimePermissions:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${ResourcePrefix}-runtime-state-journal'
      Roles: [!Select [1, !Split ['/', !Ref VerifierRoleArn]]]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:TransactWriteItems]
            Resource: !Ref VerificationHeadTableArn
          - Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:GetObjectRetention]
            Resource: !Sub '${JournalBucketArn}/${JournalPrefix}*'
          - Effect: Allow
            Action: s3:ListBucketVersions
            Resource: !Ref JournalBucketArn
            Condition: {StringLike: {s3:prefix: [!Sub '${JournalPrefix}*']}}
          - Effect: Allow
            Action: [kms:GetPublicKey, kms:Sign]
            Resource: !Ref WitnessKeyArn
  WitnessFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-runtime'
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Role: !Ref VerifierRoleArn
      ImageConfig: {Command: ['dist/witness_runtime.handler']}
      MemorySize: 512
      Timeout: 30
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          WITNESS_CONFIG_JSON: !Ref WitnessConfigJson
  PublishedVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref WitnessFunction
      Description: !Sub 'Immutable verifier witness image ${ImageUri}'
  LiveAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref WitnessFunction
      FunctionVersion: !GetAtt PublishedVersion.Version
      Name: live
  MonitorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PublishedVersion
      Principal: !Ref MonitorInvokerRoleArn
Outputs:
  FunctionArn: {Value: !GetAtt WitnessFunction.Arn}
  PublishedVersionArn: {Value: !Ref PublishedVersion}
  LiveAliasArn: {Value: !Ref LiveAlias}
