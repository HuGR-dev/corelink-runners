AWSTemplateFormatVersion: '2010-09-09'
Description: CoreLink independent receipt verifier foundation; deploy only in account 888348805607.
Parameters:
  ResourcePrefix: {Type: String, Default: corelink-verifier, AllowedPattern: '^[a-z0-9-]{1,32}$'}
Resources:
  VerificationHead:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ResourcePrefix}-head'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      DeletionProtectionEnabled: true
  WitnessKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: CoreLink verifier witness signing key
      KeySpec: RSA_3072
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement: [{Sid: AccountAdministration, Effect: Allow, Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}, Action: 'kms:*', Resource: '*'}]
  JournalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      VersioningConfiguration: {Status: Enabled}
      ObjectLockEnabled: Enabled
      ObjectLockConfiguration: {ObjectLockEnabled: Enabled, Rule: {DefaultRetention: {Mode: COMPLIANCE, Days: 8}}}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
  JournalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref JournalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement: [{Sid: RequireTLS, Effect: Deny, Principal: '*', Action: s3:*, Resource: [!GetAtt JournalBucket.Arn, !Sub '${JournalBucket.Arn}/*'], Condition: {Bool: {aws:SecureTransport: 'false'}}}]
  VerifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ResourcePrefix}-runtime'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      Policies:
        - PolicyName: exact-verifier-state-witness
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:Query], Resource: !GetAtt VerificationHead.Arn}
              - {Effect: Allow, Action: [s3:GetObject, s3:GetObjectRetention], Resource: !Sub '${JournalBucket.Arn}/journal/*'}
              - {Effect: Allow, Action: [kms:Sign, kms:GetPublicKey], Resource: !GetAtt WitnessKey.Arn}
              - {Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: '*'}
Outputs:
  VerificationHeadTableArn: {Value: !GetAtt VerificationHead.Arn}
  JournalBucketArn: {Value: !GetAtt JournalBucket.Arn}
  WitnessKeyArn: {Value: !GetAtt WitnessKey.Arn}
  VerifierRoleArn: {Value: !GetAtt VerifierRole.Arn}
