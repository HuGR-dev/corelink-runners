# deploy/cloudflare/supervisord.conf
# CoreLink Runner DevEnv - Process Manager Configuration
# Manages: xvfb, chromium, x11vnc, noVNC, ttyd, code-server, exec-server

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
pidfile=/run/supervisord.pid
minfds=4096
minprocs=256

# ── PROGRAM: xvfb (Virtual Framebuffer) ──────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 +extension RANDR +extension GLX +extension RENDER -ac
autorestart=true
startsecs=10
startretries=5
priority=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",HOME="/home/coder"
user=coder

# ── PROGRAM: chromium (Browser for Agents) ───────────────────────────
# INV-06: Deterministic DPI scaling & fixed viewport for AI Vision
[program:chromium]
command=chromium \
  --headless=new \
  --user-data-dir=/data/chrome \
  --password-store=basic \
  --no-first-run \
  --no-default-browser-check \
  --window-size=1280,720 \
  --force-device-scale-factor=1 \
  --disable-background-networking \
  --disable-sync \
  --disable-extensions-http-throttling \
  --disable-component-extensions-with-background-pages \
  --disable-background-timer-throttling \
  --disable-renderer-backgrounding \
  --disable-features=TranslateUI,BlinkGenPropertyTrees \
  --remote-debugging-port=9222 \
  --remote-debugging-address=127.0.0.1 \
  --disable-gpu-sandbox \
  --no-sandbox \
  --disable-setuid-sandbox \
  --disable-dev-shm-usage \
  --memory-pressure-off \
  --max_old_space_size=4096
autorestart=true
startsecs=15
startretries=3
priority=20
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",HOME="/home/coder",XDG_RUNTIME_DIR="/tmp/runtime-coder"
user=coder

# ── PROGRAM: x11vnc (VNC Server for xvfb display) ─────────────────────
# INV-02: Frame cap (~24 FPS) via `-wait 40 -defer 20` + Tight encoding
[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -noxdamage -noxfixes -noxrecord -nolookup -passwd "" -wait 40 -defer 20 -listen 127.0.0.1 -localhost
autorestart=true
startsecs=5
startretries=3
priority=30
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DISPLAY=":99",HOME="/home/coder"
user=coder

# ── PROGRAM: noVNC (WebSocket → VNC Proxy) ────────────────────────────
[program:novnc]
command=websockify --web /usr/share/novnc --heartbeat 30 6080 localhost:5900
autorestart=true
startsecs=5
startretries=3
priority=40
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=coder

# ── PROGRAM: ttyd (Terminal over WebSocket) ───────────────────────────
[program:ttyd]
command=ttyd -p 7681 --writable --cwd /data/workspace --title-fixed "CoreLink DevEnv" --term xterm-256color bash -l
autorestart=true
startsecs=5
startretries=3
priority=40
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/coder"
user=coder

# ── PROGRAM: code-server (VS Code Web Editor) ─────────────────────────
[program:code-server]
command=/usr/local/bin/code-server --bind-addr 127.0.0.1:8080 --auth none --disable-telemetry --disable-update-check /data/workspace
autorestart=true
startsecs=10
startretries=3
priority=40
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/coder",USER="coder"
user=coder

# ── PROGRAM: exec-server (Internal Command & Health Bridge) ───────────
[program:exec-server]
command=/usr/local/bin/exec-server --bind-addr 127.0.0.1:9090
autorestart=true
startsecs=5
startretries=3
priority=50
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/coder",USER="coder"
user=coder
