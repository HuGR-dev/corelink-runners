name: "CoreLink Memoize"
description: >-
  Run a command with CoreLink cache memoization (clw run). On a cache HIT the
  memoized result is returned WITHOUT re-running (re-runs ≈ 0). The default
  `optional` policy runs COLD if the moat is absent; after an internal error it
  retries once only with a proven NOT_STARTED receipt. Ambiguous state never retries.
  `required-hit` is fail-closed and requires
  the exact clw 0.1.12 verified no-exec HIT API; absent, older, or unknown clw
  returns exit 78. Use on a CoreLink ephemeral runner.

inputs:
  run:
    description: "The command to execute (memoized when the moat is present). Runs via bash -c."
    required: true
  inputs:
    description: >-
      Paths (files/dirs) that form the cache key — space- or newline-separated,
      each passed as a repeated `--input`. Dirs respect .gitignore/.clwignore.
      Default '.' keys on the whole working tree. Keep this to the SOURCE that
      determines the output (exclude build dirs via .clwignore) so re-runs hit.
    required: false
    default: "."
  env:
    description: "Env var NAMES (space-separated) to fold into the cache key (repeated `--env`)."
    required: false
    default: ""
  tool:
    description: >-
      Toolchains (space-separated) whose VERSION is auto-folded into the cache key
      so an upgrade correctly busts the cache (no stale build). Supported:
      rust · node · python · go. SAFETY-BY-DEFAULT: prefer this over hand-folding
      the compiler version via `env`. Unknown names are warned + ignored.
    required: false
    default: ""
  cache-policy:
    description: >-
      Cache availability policy: `optional` (default; absent moat runs COLD and a failed clw call
      falls back only with a proven NOT_STARTED receipt) or
      `required-hit` (requires the exact clw 0.1.12 verified no-exec HIT
      contract; unavailable, older, or unknown clw returns exit 78).
    required: false
    default: "optional"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        CL_RUN: ${{ inputs.run }}
        CL_INPUTS: ${{ inputs.inputs }}
        CL_ENVNAMES: ${{ inputs.env }}
        CL_TOOLS: ${{ inputs.tool }}
        CL_CACHE_POLICY: ${{ inputs.cache-policy }}
      run: |
        "${GITHUB_ACTION_PATH}/memoize.sh"
