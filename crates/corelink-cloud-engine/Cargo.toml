[package]
name = "corelink-cloud-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The frozen `Engine` seam this crate implements against a managed sandbox
# provider, plus the engine-agnostic `ContainerSpec`/`RunningContainer`/
# `CmdOutput` vocabulary and the `PinnedImageRef` supply-chain floor. Same-
# workspace path dep (house law: crates.io-only governs EXTERNAL deps).
corelink-runner = { path = "../corelink-runner" }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# SHA-256 — the collision-free suffix that makes the Northflank job-name
# derivation injective on the full spec name (workspace-pinned hash dep).
sha2       = { workspace = true }
# Outbound HTTP — used in EXACTLY one place (`UreqTransport`); the engine logic
# and the whole test suite talk to the `HttpTransport` trait, never to ureq.
ureq       = { workspace = true }
