# WP-CF0d — control-plane core types (CF0 freeze items 4+5).
# Workspace-internal path dep only; wire-contract law (deny.toml: crates.io
# only for external sources) is untouched.
[package]
name = "corelink-fabric"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
corelink-runners-contracts = { path = "../corelink-runners-contracts" }
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# Persistent lease ledger (WP-3-PGLEDGER) — the production `PgLedger` over
# Postgres. The `LeaseLedger` trait stays sync; `PgLedger` bridges to these
# async clients via `tokio::task::block_in_place` on the server's
# rt-multi-thread runtime. tokio is needed only for the runtime `Handle` type.
tokio-postgres    = { workspace = true }
deadpool-postgres = { workspace = true }
postgres-types    = { workspace = true }
postgres-protocol = { workspace = true }
tokio = { workspace = true }
