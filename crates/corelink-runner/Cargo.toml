# Transplanted from hugit/crates/hugit-runner @ ead800d83d19bfd7f90bf4241ee27b18b09007f1 (runner-transfer campaign R2, 2026-06-10) — wire-contract seam, no git dep.
[package]
name = "corelink-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
corelink-runners-contracts = { path = "../corelink-runners-contracts" }
anyhow = { workspace = true }
# WP-S13.5: serde-Serialize for the wrapper-level `CloseReason`
# (`normal|expired|crashed`) close-metadata — NOT inside the frozen §13.4
# IntentMetrics vector.
serde = { workspace = true }
# WP-R4: fence materialization content digests (SHA-256 lowercase hex, the
# frozen WP-00 scalar convention).
sha2    = { workspace = true }
# WP-2 (moat build): BLAKE3 is the native CAS/AC content-addressed key type
# (A9b: SHA-256 MUST NOT be used as a native-CAS key; only BLAKE3 hex).
blake3  = { workspace = true }
# WP-ATT1a: attestation sign/verify (ratified decision #2: ed25519, fabric
# key) + standard-base64 wire encoding of signature/public key.
base64 = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
