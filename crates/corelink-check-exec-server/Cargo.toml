[package]
name = "corelink-check-exec-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "corelink-check-exec-server"
path = "src/main.rs"

[dependencies]
# WP-W1 (CF check-host §C4): the in-container exec-server is an axum HTTP
# server on port 8080, reachable ONLY via the Worker's containerFetch (the
# container boundary + the Worker bearer are the gates; no auth here). House
# HTTP stack — axum 0.7 minimal, mirrored from corelink-fabric-server, never
# forked.
axum       = { workspace = true }
# `rt-multi-thread`+`macros` (the `#[tokio::main]` runtime), `net` (the
# `0.0.0.0:8080` TcpListener + `axum::serve`), `process` (the captured
# subprocess: spawn / wait / kill-the-group on timeout), `io-util` (drain the
# child pipes), `time` (the timeout race against the child wait). Every one of
# these features is ALREADY enabled on the workspace tokio (and its transitive
# deps libc/mio/signal-hook-registry are already in Cargo.lock), so this crate
# adds ZERO new crates to the lock.
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time"] }
serde      = { workspace = true }
serde_json = { workspace = true }
# Process-GROUP teardown on timeout: the child is started in its own process
# group (pre_exec setpgid) so a timeout can `killpg` the whole tree — a
# subprocess that double-forks can't outlive the deadline. `libc` is already in
# Cargo.lock (tokio's transitive dep), so naming it adds ZERO new crates. Used
# in exactly two calls (setpgid in the pre_exec hook, killpg on timeout).
libc       = "=0.2.186"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "macros", "rt-multi-thread", "time"] }
tower = { workspace = true }
# The process-group acceptance test probes child liveness with `kill(pid, 0)`.
libc = "=0.2.186"
