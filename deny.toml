# cargo-deny configuration — supply-chain policy for the corelink-runners
# workspace. House policy inherited from hugit (HuGR family discipline).
# Run: cargo deny check

[licenses]
# Allow only these SPDX identifiers for dependency licenses (the HuGR house
# allow-set, kept identical to hugit's).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Zlib",
]
# Our own crates are closed-source / no SPDX license — ignore them.
private = { ignore = true }

[bans]
# Deny multiple versions of the same crate. No skips: this workspace has no
# dependencies yet — add documented skips only when a transitive duplicate
# genuinely cannot be collapsed (hugit's deny.toml is the template).
multiple-versions = "deny"

[sources]
# Only allow dependencies from crates.io; deny unknown registries and git deps.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
