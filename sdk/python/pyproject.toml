[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corelink-verify"
version = "0.1.0"
description = "In-language v2 result-binding verifier for CoreLink fabric responses"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
keywords = ["corelink", "hugr", "ed25519", "attestation", "verify"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41",
]

[project.urls]
Repository = "https://github.com/HuGR-dev/corelink-runners"
Homepage = "https://github.com/HuGR-dev/corelink-runners"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["corelink_verify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
